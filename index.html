<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<title>鉱脈</title>
<meta name="description" content="声で今日を掘り、その中の筋を見つける日記。">
<meta name="theme-color" content="#F4F2EE">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="vein">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" sizes="180x180" href="./icon-180-v2.png">
<link rel="apple-touch-icon-precomposed" sizes="180x180" href="./icon-180-v2.png">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192-v2.png">
<link rel="icon" type="image/png" sizes="512x512" href="./icon-512-v2.png">
<style>html,body{background:#F4F2EE}</style>
</head>
<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+2:wght@300;400;500&display=swap">
<style>
/* ── 昼の紙の地。ember（黒地・残り火）や aloud と分けるため、白トーン＋鉱石の色 ──
   --acc  照りのある赤錆＝掘り当てたもの（洞察・見出し）
   --acc2 緑青＝次へ渡すもの（問い）
   地は真っ白ではなく、わずかに温かい紙。字は黒ではなく墨。 */
/* ── 紙と墨だけ。ember（黒地）と分けるために地は白トーン。
   色で差を付けず、濃さ・大きさ・余白で差を付ける。 */
:root{
  color-scheme: light;
  --void:#F4F2EE;          /* 紙 */
  --void2:#FFFFFF;         /* 浮くもの（通知・面） */
  --lume:#14120F;          /* 墨 */
  --l86:rgba(20,18,15,.86);
  --l58:rgba(20,18,15,.58);
  --l40:rgba(20,18,15,.40);
  --l26:rgba(20,18,15,.26);
  --l16:rgba(20,18,15,.16);
  --l09:rgba(20,18,15,.09);
  --l05:rgba(20,18,15,.045);
  /* 「アクセント」は色ではなく墨そのもの。使う場所だけ決めておく */
  --acc:#14120F;
  --acc86:rgba(20,18,15,.86);
  --acc40:rgba(20,18,15,.34);
  --acc16:rgba(20,18,15,.13);
  --acc08:rgba(20,18,15,.05);
  --acc2:rgba(20,18,15,.40);
  --f:"M PLUS 2",-apple-system,'Hiragino Sans','Helvetica Neue',sans-serif;
  --ease:cubic-bezier(.2,.9,.25,1);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--void);color:var(--lume);font-family:var(--f);overscroll-behavior:none}
body{font-size:15px;font-weight:400;line-height:1.7;letter-spacing:.01em;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input{font:inherit;color:inherit;background:none;border:0}
:focus-visible{outline:1px solid var(--l58);outline-offset:3px}
/* 英字ラベルの共通の置き方（読ませるためではなく、添えるために置く） */
.lo{text-transform:lowercase;letter-spacing:.28em;text-indent:.28em}

/* ── 2面トラック：左=話す 右=記録 ── */
.track{display:flex;height:100dvh;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.track::-webkit-scrollbar{display:none}
.track.lock{overflow-x:hidden}
.pane{position:relative;flex:0 0 100%;height:100dvh;scroll-snap-align:center;scroll-snap-stop:always;overflow:hidden}

.dots{position:fixed;left:0;right:0;bottom:max(16px,env(safe-area-inset-bottom));display:flex;gap:7px;justify-content:center;z-index:40;pointer-events:none;transition:opacity .3s}
.dots i{width:4px;height:4px;border-radius:50%;background:var(--l16);transition:background .3s,width .3s var(--ease)}
.dots i.on{background:var(--acc);width:14px;border-radius:2px}
body.kb .dots{opacity:0}

/* ── 話す面 ── */
#speak{display:flex;flex-direction:column;
  padding:calc(env(safe-area-inset-top) + 10px) 20px calc(env(safe-area-inset-bottom) + 46px);
  padding-bottom:calc(env(safe-area-inset-bottom) + 46px + var(--kb,0px));
  transition:padding-bottom .22s var(--ease)}

/* ── 語の野 ──
   語は丸のまわりを回りつづけ、ときどき消えて別の語に入れ替わる。
   下（問いのすぐ上）を通る語が focus になり、問いがひとりでに変わる。
   語は触らない。触るのは真ん中の丸だけなので pointer-events は載せない。 */
.field{position:relative;flex:1 1 auto;min-height:0;opacity:1;transition:opacity .3s}
#speak[data-state="talk"] .field{opacity:0;pointer-events:none;position:absolute;inset:0}
.word{position:absolute;left:50%;top:48%;pointer-events:none;
  font-size:13px;font-weight:400;color:var(--l26);text-transform:lowercase;letter-spacing:.2em;
  white-space:nowrap;will-change:transform;
  transition:color .55s,opacity .7s var(--ease)}
.word i{display:block;font-style:normal;transition:transform .55s var(--ease)}
.word.on{color:var(--acc86)}
.word.on i{transform:scale(1.42)}
.word.out{opacity:0}
.word.out i{transform:scale(.72)}

/* 真ん中。平らな墨1色。輪郭だけがアメーバのように歪みつづける（生きている）。
   球にもグラデーションにも影にもしない。輪も広げない。 */
.orbwrap{position:absolute;left:50%;top:48%;width:96px;height:96px;margin:-48px 0 0 -48px}
.orb{position:absolute;inset:0;padding:0;border:0;background:none;touch-action:manipulation;
  transition:transform .2s var(--ease)}
.orb svg{display:block;width:100%;height:100%;overflow:visible}
.orb path{fill:var(--lume)}
.orb.press{transform:scale(.94)}

/* 問い。focus が移るたび、ひとりでに書き替わる */
.ask{flex:0 0 auto;min-height:3.2em;display:flex;align-items:center;justify-content:center;
  text-align:center;font-weight:300;font-size:16.5px;line-height:1.62;color:var(--l58);
  word-break:auto-phrase;opacity:0;transition:opacity .42s}
.ask.on{opacity:1}
#speak[data-state="talk"] .ask{display:none}

@media (prefers-reduced-motion: reduce){
  .word,.word i{transition:none}
}

/* 喋ったものが出る面。長い文でも全部が一度に目に入るよう、字を自分で縮める。
   読むためではなく「入っている」ことが見えるための字。 */
.said{flex:1 1 auto;min-height:0;width:100%;overflow:hidden;
  font-weight:300;font-size:20px;line-height:1.62;letter-spacing:-.005em;
  word-break:auto-phrase;white-space:pre-wrap;
  -webkit-mask-image:linear-gradient(180deg,transparent 0,#000 22px);
  mask-image:linear-gradient(180deg,transparent 0,#000 22px);
  display:none}
#speak[data-state="talk"] .said{display:block}
.said:focus{outline:none}
.said:empty::before{content:"speak";color:var(--l16);font-size:12px;letter-spacing:.34em}
.meta{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;
  height:0;opacity:0;overflow:hidden;font-size:10.5px;color:var(--l26);transition:opacity .3s}
#speak[data-state="talk"] .meta{height:22px;opacity:1}
.acts{flex:0 0 auto;display:flex;align-items:center;justify-content:center;gap:26px;
  max-height:0;opacity:0;margin-top:0;overflow:hidden;
  transition:max-height .3s var(--ease),opacity .24s,margin-top .3s var(--ease)}
#speak[data-state="talk"] .acts{max-height:80px;opacity:1;margin-top:18px}
.keep{min-height:52px;padding:0 42px;border-radius:26px;border:0;background:var(--lume);color:var(--void);
  font-size:13px;font-weight:500;transition:transform .18s var(--ease)}
.keep:active{transform:scale(.97)}
.thin{color:var(--l40);font-size:12px}
.thin:active{color:var(--l86)}
.tip{position:absolute;left:0;right:0;bottom:calc(20px + env(safe-area-inset-bottom));
  text-align:center;font-size:10px;color:var(--l16);pointer-events:none}
body.kb .tip{opacity:0}

/* ── 記録面 ── */
#log{display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
.head{flex:0 0 auto;padding:22px 22px 6px}
.count{display:flex;align-items:baseline;gap:22px;margin-bottom:16px}
.count b{font-weight:300;font-size:30px;letter-spacing:-.02em}
.count span{font-size:9.5px;color:var(--l26)}
.count i{font-style:normal;display:block}
.cloud{display:flex;flex-wrap:wrap;gap:7px 10px;margin-bottom:4px}
.tag{border:1px solid var(--l09);background:var(--l05);border-radius:14px;padding:4px 11px;
  font-size:12px;color:var(--l58);transition:color .2s,border-color .2s,background .2s}
.tag em{font-style:normal;color:var(--l16);margin-left:5px;font-size:10px}
.tag.on{color:var(--void2);background:var(--acc);border-color:var(--acc)}
.tag.on em{color:rgba(255,255,255,.55)}
.tag.big{font-size:15px;padding:6px 14px;color:var(--acc86);border-color:var(--acc16);background:var(--acc08)}
.tag.mid{font-size:13.5px}

.scroll{flex:1 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:10px 22px calc(70px + env(safe-area-inset-bottom))}

/* ── 記録＝日ごとの帯。1日を24時間の1本にして、書いた時刻に点を置く ──
   1日に何度でも書けるので、点が増えていくことが見えるようにしてある。 */
.axis{display:flex;justify-content:space-between;padding:2px 0 8px;
  font-size:8.5px;letter-spacing:.06em;color:var(--l16)}
.dayrow{margin:0 0 16px}
.dh{display:flex;align-items:baseline;gap:9px;margin-bottom:5px}
.dh b{font-weight:400;font-size:12px;color:var(--l58)}
.dh span{font-size:9.5px;color:var(--l16)}
.dh em{margin-left:auto;font-style:normal;font-size:9.5px;color:var(--l26)}
.tr{position:relative;height:28px}
.tr::before{content:"";position:absolute;left:0;right:0;top:50%;height:1px;background:var(--l09)}
.tr.now::before{background:var(--l16)}
.tick{position:absolute;top:50%;width:1px;height:7px;margin-top:-3.5px;background:var(--l09)}
.pt{position:absolute;top:50%;width:11px;height:11px;margin:-5.5px 0 0 -5.5px;border-radius:50%;
  background:var(--void);border:1px solid var(--l40);transition:transform .18s var(--ease)}
.pt.kept{background:var(--lume);border-color:var(--lume)}
.pt.hit{box-shadow:0 0 0 3px var(--l09)}
.pt.slow{animation:pulse 1.5s ease-in-out infinite}
.pt:active{transform:scale(1.4)}
.items{display:flex;flex-direction:column}
.it{display:flex;gap:10px;width:100%;text-align:left;padding:7px 0;border-top:1px solid var(--l05)}
.it:active{background:var(--l05)}
.it u{flex:0 0 2.9em;text-decoration:none;font-size:9.5px;color:var(--l26);padding-top:2px}
.it div{flex:1 1 auto;min-width:0}
.it p{margin:0;font-size:13px;line-height:1.62;color:var(--l86);word-break:auto-phrase;
  display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden}
.it .tg{display:flex;flex-wrap:wrap;gap:7px;margin-top:4px}
.it .tg s{text-decoration:none;font-size:10.5px;color:var(--acc)}
.it .tg s::before{content:"#";color:var(--acc40);margin-right:1px}
.it .st{font-size:9.5px;color:var(--l26);margin-top:4px;display:block}
.gap{display:flex;align-items:center;gap:9px;margin:0 0 16px;font-size:9px;color:var(--l16)}
.gap hr{flex:1 1 auto;height:1px;border:0;background:var(--l05);margin:0}
.dot{width:5px;height:5px;border-radius:50%;background:var(--acc);flex:0 0 auto}
.dot.slow{animation:pulse 1.5s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.2}50%{opacity:1}}
.empty{text-align:center;color:var(--l16);font-size:11px;padding:64px 0}

/* 端の設定（鍵）。記録面のいちばん下 */
.key{margin:34px 0 8px;padding-top:18px;border-top:1px solid var(--l09)}
.key h3{margin:0 0 10px;font-weight:400;font-size:9.5px;color:var(--l26)}
.key .row{display:flex;gap:10px;align-items:center}
.key input{flex:1 1 auto;min-width:0;border-bottom:1px solid var(--l16);padding:8px 2px;font-size:13px}
.key input::placeholder{color:var(--l16)}
.key button{font-size:11px;color:var(--l40);padding:8px 4px}
.key p{margin:12px 0 0;font-size:10.5px;line-height:1.8;color:var(--l16)}

/* ── ひらく面（1件の全体） ── */
.sheet{position:fixed;inset:0;z-index:60;background:var(--void);
  display:flex;flex-direction:column;transform:translateY(100%);transition:transform .38s var(--ease)}
.sheet.on{transform:none}
.mark{display:flex;align-items:baseline;gap:9px;margin-bottom:20px}
.mark svg{flex:0 0 auto}
.mark b{font-weight:400;font-size:15px;letter-spacing:.06em}
.mark span{font-size:9.5px;color:var(--l26)}

.sheet .top{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;
  padding:calc(env(safe-area-inset-top) + 14px) 22px 10px;font-size:10px;color:var(--l26)}
.sheet .body{flex:1 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:6px 22px calc(30px + env(safe-area-inset-bottom))}
.sheet .foot{flex:0 0 auto;display:flex;align-items:center;justify-content:center;gap:24px;
  padding:12px 22px calc(14px + env(safe-area-inset-bottom));border-top:1px solid var(--l09)}

.digest{width:100%;text-align:left;font-weight:300;font-size:18.5px;line-height:1.82;
  letter-spacing:-.005em;word-break:auto-phrase;white-space:pre-wrap;color:var(--lume)}
.digest:active{color:var(--l58)}
.hint{margin:18px 0 0;font-size:10px;color:var(--l16);text-align:center}
.sec{margin-top:34px}
.sec h4{margin:0 0 14px;font-weight:400;font-size:9.5px;color:var(--l40)}
.pick{margin-bottom:16px}
.pick b{display:block;font-weight:500;font-size:15.5px;line-height:1.6;margin-bottom:4px;
  color:var(--lume);word-break:auto-phrase}
.pick span{font-size:13px;line-height:1.85;color:var(--l58);word-break:auto-phrase}
.ask2{font-weight:300;font-size:16px;line-height:1.72;margin-bottom:14px;padding:2px 0 2px 14px;
  border-left:1px solid var(--l26);word-break:auto-phrase}
.note{font-size:13px;line-height:1.85;color:var(--l58);margin-bottom:14px;word-break:auto-phrase}
.note b{font-weight:500;color:var(--l86)}
.origin{margin:0;padding:0;list-style:none}
.origin li{position:relative;padding-left:14px;margin-bottom:7px;font-size:13px;line-height:1.8;color:var(--l58);word-break:auto-phrase}
.origin li::before{content:"";position:absolute;left:0;top:.85em;width:5px;height:1px;background:var(--l26)}
.fold{font-size:10px;color:var(--l26);padding:6px 0}
.raw{font-size:11.5px;line-height:1.9;color:var(--l26);white-space:pre-wrap;word-break:auto-phrase;margin:8px 0 0}
.busy{display:flex;align-items:center;gap:9px;font-size:10.5px;color:var(--l40);margin-top:20px}

/* ── 通知 ── */
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translate(-50%,14px);
  z-index:80;display:flex;align-items:center;gap:16px;max-width:min(88vw,26em);
  padding:11px 17px;border-radius:20px;background:var(--void2);border:1px solid var(--l09);
  box-shadow:0 6px 24px rgba(20,18,15,.10);
  font-size:12.5px;line-height:1.6;opacity:0;pointer-events:none;transition:opacity .26s,transform .26s var(--ease)}
.toast.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast button{flex:0 0 auto;font-size:11px;color:var(--acc)}
.fly{position:fixed;z-index:70;pointer-events:none;font-size:15px;color:var(--l86);white-space:nowrap;
  transition:transform .62s var(--ease),opacity .62s ease-in}
</style>

<div class="track" id="track">

  <!-- ───────── 話す ───────── -->
  <section class="pane" id="speak" data-state="idle">
    <div class="field" id="field"></div>
    <div class="ask" id="ask"></div>
    <div class="said" id="said" contenteditable="true" role="textbox" aria-label="話したこと" spellcheck="false"></div>
    <div class="meta"><span id="mLen"></span><button class="thin" id="clear">clear</button></div>
    <div class="acts">
      <button class="keep lo" id="keepBtn">keep</button>
      <button class="thin lo" id="dropBtn">close</button>
    </div>
    <div class="tip lo" id="tip"></div>
  </section>

  <!-- ───────── 記録 ───────── -->
  <section class="pane" id="log">
    <div class="head">
      <div class="mark">
        <svg id="mark" width="24" height="24" viewBox="0 0 100 100" aria-hidden="true"></svg>
        <b>鉱脈</b><span class="lo">vein</span>
      </div>
      <div class="count">
        <span><b id="cDays">0</b><i class="lo">days</i></span>
        <span><b id="cRow">0</b><i class="lo">in a row</i></span>
        <span><b id="cTag">0</b><i class="lo">insights</i></span>
      </div>
      <div class="cloud" id="cloud"></div>
    </div>
    <div class="scroll" id="list"></div>
  </section>

</div>

<div class="dots" id="dots" aria-hidden="true"><i class="on"></i><i></i></div>

<div class="sheet" id="sheet" aria-hidden="true">
  <div class="top">
    <span id="sWhen"></span>
    <button class="thin lo" id="sClose">close</button>
  </div>
  <div class="body" id="sBody"></div>
  <div class="foot" id="sFoot"></div>
</div>

<div class="toast" id="toast" role="status">
  <span id="toastMsg"></span><button id="toastAct" hidden></button>
</div>

<script>
(function(){
"use strict";
var $=function(id){return document.getElementById(id)};
var KEY='murmur_state_v1';
var reduced=window.matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ───────── 日付（ローカル固定・UTCずれなし） ───────── */
function ymd(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function today(){return ymd(new Date())}
function nowIso(){
  var d=new Date(),o=-d.getTimezoneOffset(),s=o<0?'-':'+',a=Math.abs(o);
  return ymd(d)+'T'+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')+':'+String(d.getSeconds()).padStart(2,'0')
    +s+String(Math.floor(a/60)).padStart(2,'0')+':'+String(a%60).padStart(2,'0');
}
var WD=['日','月','火','水','木','金','土'];
function dayLabel(day){
  var p=day.split('-'),d=new Date(+p[0],+p[1]-1,+p[2]);
  var t=today();
  if(day===t)return '今日';
  var y=new Date();y.setDate(y.getDate()-1);
  if(day===ymd(y))return '昨日';
  return (+p[1])+'月'+(+p[2])+'日 '+WD[d.getDay()];
}
function hhmm(iso){var m=/T(\d\d:\d\d)/.exec(iso||'');return m?m[1]:''}
function uid(){return 'm'+Date.now().toString(36)+Math.random().toString(36).slice(2,8)}

/* ───────── 保存 ───────── */
function blank(){return {version:1,entries:[],settings:{key:''}}}
var mem={},volatile=false,warned=false;
var store={
  get:function(k){try{return localStorage.getItem(k)}catch(e){volatile=true;return k in mem?mem[k]:null}},
  set:function(k,v){try{localStorage.setItem(k,v)}catch(e){volatile=true;mem[k]=v}}
};
var state=(function load(){
  var raw=store.get(KEY);
  if(!raw)return blank();
  try{
    var s=JSON.parse(raw);
    if(!s||!Array.isArray(s.entries))throw new Error('shape');
    s.version=1;
    s.settings=s.settings&&typeof s.settings==='object'?s.settings:{};
    s.settings.key=String(s.settings.key||'');
    s.entries.forEach(function(e){
      e.raw=String(e.raw||'');
      e.lines=Array.isArray(e.lines)?e.lines:[];
      e.digest=String(e.digest||'');
      e.tags=Array.isArray(e.tags)?e.tags:[];
      e.picks=Array.isArray(e.picks)?e.picks:[];
      e.asks=Array.isArray(e.asks)?e.asks:[];
      e.notes=Array.isArray(e.notes)?e.notes:[];
      e.status=e.status||'draft';           // draft → read → kept
      e.day=e.day||(e.createdAt||'').slice(0,10)||today();
      e.busy=false;                          // 処理中は保存しない（開き直しで固まらないよう）
    });
    return s;
  }catch(err){
    store.set(KEY+'_backup_'+Date.now(),raw);
    setTimeout(function(){say('保存データを読めなかった。退避して新しく始める。')},400);
    return blank();
  }
})();
function save(){
  store.set(KEY,JSON.stringify(state,function(k,v){return k==='busy'?undefined:v}));
  if(volatile&&!warned){warned=true;setTimeout(function(){say('この画面ではデータが残らない。ホーム画面に追加して使って。')},600)}
}
function find(id){for(var i=0;i<state.entries.length;i++)if(state.entries[i].id===id)return state.entries[i];return null}

/* ───────── 通知 ───────── */
var toast=$('toast'),toastMsg=$('toastMsg'),toastAct=$('toastAct'),toastT=null;
function say(msg,label,fn){
  toastMsg.textContent=msg;
  if(label){toastAct.hidden=false;toastAct.textContent=label;toastAct.onclick=function(){hideToast();fn()}}
  else{toastAct.hidden=true;toastAct.onclick=null}
  toast.classList.add('on');
  clearTimeout(toastT);toastT=setTimeout(hideToast,label?6000:3000);
}
function hideToast(){toast.classList.remove('on')}

/* ───────── 面の移動 ───────── */
var track=$('track'),dots=$('dots').children,pane=0;
function goPane(i,smooth){track.scrollTo({left:track.clientWidth*i,behavior:smooth===false?'auto':'smooth'})}
track.addEventListener('scroll',function(){
  var w=track.clientWidth||1,i=Math.round(track.scrollLeft/w);
  i=Math.max(0,Math.min(1,i));
  if(i===pane)return;
  pane=i;
  for(var k=0;k<2;k++)dots[k].classList.toggle('on',k===pane);
  if(pane===0)start();else stop();
},{passive:true});
window.addEventListener('resize',function(){measure();goPane(pane,false)});

/* ───────── 語の野 ─────────
   日記の入り口になる概念を、丸のまわりに回しておく。語は触らない（触るのは丸だけ）。

   3つのことが同時に起きている:
   1. 語は円軌道をゆっくり回る。半径・速さ・向き・揺れは語ごとに違う
   2. ときどき1語が消えて、置いていない語に入れ替わる（同じ12語を見つづけない）
   3. 下（問いのすぐ上）を通る語が focus になり、問いがひとりでに書き替わる

   ◯ を押した瞬間の focus が、その日記の入口（seed）として残る。 */
var WORDS=[
  {w:'do',     q:'今日、実際に何をした？'},
  {w:'be',     q:'今日、どんな状態でいた？'},
  {w:'have',   q:'いま何を持っていて、何が足りない？'},
  {w:'feel',   q:'いちばん強く動いたのは、どの瞬間？'},
  {w:'meet',   q:'誰と会って、何が残った？'},
  {w:'want',   q:'ほんとうに欲しいのは、なに？'},
  {w:'lose',   q:'今日、手放したもの・失ったものは？'},
  {w:'learn',  q:'知らなかった、と気づいたことは？'},
  {w:'give',   q:'誰に、何を渡した？'},
  {w:'stuck',  q:'どこで詰まった？なぜ動かない？'},
  {w:'why',    q:'なぜ、それをやっている？'},
  {w:'next',   q:'明日いちばん先に手をつけるのは？'},
  {w:'notice', q:'誰も言っていないけれど、見えたことは？'},
  {w:'change', q:'半年前と、何が変わった？'},
  {w:'money',  q:'今日、お金はどこへ流れていた？'},
  {w:'body',   q:'体はなんと言っている？'},
  {w:'time',   q:'いちばん長く使った時間は、何に？'},
  {w:'people', q:'世の中の人は、いま何を欲しがっている？'},
  {w:'work',   q:'その仕事は、誰の何を動かした？'},
  {w:'rule',   q:'当たり前だと思って従っている決まりは？'},
  {w:'doubt',  q:'ほんとうかな、と思ったのはどれ？'},
  {w:'build',  q:'いま何を作っている？なぜそれを？'},
  {w:'fail',   q:'うまくいかなかったのは、どこから？'},
  {w:'trust',  q:'誰を信じ、誰を測っている？'},
  {w:'city',   q:'街で目についたものは？'},
  {w:'read',   q:'読んだ・聞いたもので残ったのは？'},
  {w:'price',  q:'それの値段は、何で決まっている？'},
  {w:'quiet',  q:'静かなときに浮かんでくるのは？'},
  {w:'anger',  q:'何に腹が立った？その下には何がある？'},
  {w:'hope',   q:'そうなったらいい、と思うのは？'},
  {w:'edge',   q:'いま、どの境目に立っている？'},
  {w:'waste',  q:'無駄だったと思うのは、ほんとうに無駄？'}
];

/* 見えている語の数と、それぞれの道。
   同心円にすると輪の間隔が狭いところで数珠つなぎになり、
   楕円を傾けると縦長の道が横幅に潰されて真ん中へ寄ってしまう。
   ここでは「縦横の伸びが語ごとに違う楕円 ＋ ゆっくり流れる中心」でばらけさせている。 */
var SLOTS=[
  {rx:.08,ry:.34,sp: .000130},
  {rx:.92,ry:.10,sp:-.000101},
  {rx:.34,ry:.76,sp: .000086},
  {rx:.66,ry:.52,sp:-.000119},
  {rx:.14,ry:.96,sp: .000071},
  {rx:.78,ry:.30,sp:-.000094},
  {rx:.48,ry:.66,sp:-.000112},
  {rx:1.0,ry:.46,sp: .000079},
  {rx:.26,ry:.56,sp:-.000068},
  {rx:.58,ry:.88,sp: .000106},
  {rx:.86,ry:.72,sp: .000092}
];
var FOCUS_TURN=4600;        /* 何ミリ秒ごとに focus を次の語へ渡すか */
var NO_REPEAT=9;            /* 直近この数の語には focus を戻さない。画面に出ている語数より少なくしておく */
var SWAP_MS=6800;           /* 何ミリ秒ごとに1語を入れ替えるか */

var field=$('field'),speak=$('speak'),said=$('said'),askEl=$('ask'),orb=null,seed='';
var live=[],RX=0,RY=0,focusI=-1,askShown='',raf=null,lastT=0,beat=null,swapping=false,focusAt=0;
var recent=[];              /* 最近 focus を当てた語（WORDS の番号） */
var blobPath=null;

/* ───────── 真ん中のアメーバ ─────────
   円ではなく、9点の半径がそれぞれ違う周期で伸び縮みする閉じた曲線。
   点を Catmull-Rom で結んでベジェにするので、角が出ない。
   平らな1色のまま、輪郭だけが動く。 */
var BN=9,BR=33;
function blobD(t){
  var p=[],i;
  for(i=0;i<BN;i++){
    var a=i/BN*Math.PI*2;
    var r=BR*(1
      +0.090*Math.sin(t*0.00062+i*1.7)
      +0.055*Math.sin(t*0.00041+i*2.9)
      +0.030*Math.sin(t*0.00097+i*0.8));
    p.push([50+Math.cos(a)*r,50+Math.sin(a)*r]);
  }
  var d='M'+p[0][0].toFixed(2)+' '+p[0][1].toFixed(2);
  for(i=0;i<BN;i++){
    var p0=p[(i-1+BN)%BN],p1=p[i],p2=p[(i+1)%BN],p3=p[(i+2)%BN];
    d+='C'+(p1[0]+(p2[0]-p0[0])/6).toFixed(2)+' '+(p1[1]+(p2[1]-p0[1])/6).toFixed(2)
      +','+(p2[0]-(p3[0]-p1[0])/6).toFixed(2)+' '+(p2[1]-(p3[1]-p1[1])/6).toFixed(2)
      +','+p2[0].toFixed(2)+' '+p2[1].toFixed(2);
  }
  return d+'Z';
}

function measure(){
  var w=field.clientWidth||window.innerWidth,h=field.clientHeight||window.innerHeight;
  /* 横は字の箱がはみ出さないところまで、縦は面をだいたい使いきるところまで */
  RX=Math.max(80,Math.min(w*0.40,w/2-38));
  RY=Math.max(120,h*0.43);
  for(var i=0;i<live.length;i++){
    var l=live[i];
    l.rx=72+l.rxf*(RX-72);
    l.ry=120+l.ryf*(RY-120);
  }
}
function freeWord(){
  var used={};live.forEach(function(l){used[l.wi]=1});
  var fresh=[],pool=[];
  for(var i=0;i<WORDS.length;i++){
    if(used[i])continue;
    pool.push(i);
    if(recent.indexOf(i)<0)fresh.push(i);      /* 最近出したものは後回し */
  }
  var use=fresh.length?fresh:(pool.length?pool:null);
  if(!use)return Math.floor(Math.random()*WORDS.length);
  return use[Math.floor(Math.random()*use.length)];
}
function place(){
  field.innerHTML='';live=[];focusI=-1;
  SLOTS.forEach(function(sl,i){
    var el=document.createElement('span');
    el.className='word';
    var inner=document.createElement('i');
    el.appendChild(inner);
    field.appendChild(el);
    var l={el:el,inner:inner,wi:-1,rxf:sl.rx,ryf:sl.ry,sp:sl.sp,rx:0,ry:0,
           a:(i/SLOTS.length)*Math.PI*2+Math.random()*.4,born:performance.now()+i*90,
           p1:Math.random()*6.28,p2:Math.random()*6.28};
    l.wi=freeWord();
    live.push(l);
    inner.textContent=WORDS[l.wi].w;
  });

  var wrap=document.createElement('div');
  wrap.className='orbwrap';
  orb=document.createElement('button');
  orb.className='orb';orb.setAttribute('aria-label','押して、今日を声に出す');
  orb.innerHTML='<svg viewBox="0 0 100 100" aria-hidden="true"><path d=""></path></svg>';
  blobPath=orb.querySelector('path');
  orb.addEventListener('pointerdown',function(){orb.classList.add('press')});
  ['pointerup','pointercancel','pointerleave'].forEach(function(ev){
    orb.addEventListener(ev,function(){orb.classList.remove('press')});
  });
  orb.addEventListener('click',openInput);
  wrap.appendChild(orb);
  field.appendChild(wrap);

  measure();
  if(blobPath)blobPath.setAttribute('d',blobD(performance.now()));
  draw2(performance.now());
  /* 立ち上げ直後にひとつ当てておく（問いの空白を作らない）。場所は問わない */
  focusTo(Math.floor(Math.random()*live.length));
  if(reduced)rotateFocusSlowly();else start();
}

function setAsk(q){
  if(q===askShown)return;
  var first=!askShown;
  askShown=q;
  if(first){askEl.textContent=q;askEl.classList.add('on');return}
  askEl.classList.remove('on');
  setTimeout(function(){
    if(askShown!==q)return;
    askEl.textContent=q;askEl.classList.add('on');
  },260);
}
function focusTo(i){
  if(i===focusI)return;
  focusAt=performance.now();
  if(focusI>=0&&live[focusI])live[focusI].el.classList.remove('on');
  focusI=i;
  if(i<0)return;
  live[i].el.classList.add('on');
  recent.push(live[i].wi);
  while(recent.length>NO_REPEAT)recent.shift();
  setAsk(WORDS[live[i].wi].q);
}

/* 速さが違うので、放っておくと語同士が重なって読めなくなる。
   半径の近いものが角度で近づいたときだけ、そっと押し合う。 */
function spread(dt){
  for(var i=0;i<live.length;i++)for(var j=i+1;j<live.length;j++){
    var a=live[i],b=live[j];
    if(a.x===undefined||b.x===undefined)continue;
    var dx=Math.abs(a.x-b.x),dy=Math.abs(a.y-b.y);
    if(dy>40||dx>100)continue;                       /* 字の箱ぶん */
    /* 近いほど強く。急に飛ばないよう、遠いところでは効かせない */
    var f=(1-dx/100)*(1-dy/40);
    var g=Math.atan2(Math.sin(a.a-b.a),Math.cos(a.a-b.a));
    var push=0.0024*f*dt*(g>=0?1:-1);
    a.a+=push;b.a-=push;
  }
}

/* 位置を置くだけ。1フレームぶん。
   楕円の上を進みながら、中心そのものがゆっくり流れるので、同じ道を二度通らない。 */
var DX=13,DY=26;
function draw2(t){
  for(var i=0;i<live.length;i++){
    var l=live[i];
    var x=Math.cos(l.a)*l.rx+DX*Math.sin(t*0.000205+l.p1);
    var y=Math.sin(l.a)*l.ry+DY*Math.sin(t*0.000163+l.p2);
    l.x=x;l.y=y;
    l.el.style.transform='translate(-50%,-50%) translate('+x.toFixed(1)+'px,'+y.toFixed(1)+'px)';
  }
}
/* 下を通っている語へ focus を渡す */
/* focus は場所で選ばない。
   下に近い語を選んでいたころは、光る語がいつも画面の下にいて、
   同じ語に何度も戻るので問いが繰り返して見えていた。

   いまは「最近当てていない語」の中から、
   いま光っている語からいちばん離れて見えるものへ渡す。
   結果として光は画面のあちこちへ飛び、問いは NO_REPEAT 回ぶん繰り返さない。 */
function pickFocus(t){
  if(t-focusAt<FOCUS_TURN)return;
  var fx=(focusI>=0&&live[focusI])?live[focusI].x:0;
  var fy=(focusI>=0&&live[focusI])?live[focusI].y:0;
  var best=-1,bd=-1,fallback=-1,fbAge=1e9;
  for(var i=0;i<live.length;i++){
    if(i===focusI||live[i].x===undefined)continue;
    var seen=recent.indexOf(live[i].wi);
    if(seen<0){
      var d=Math.hypot(live[i].x-fx,live[i].y-fy);
      if(d>bd){bd=d;best=i}                   /* まだ当てていない語のうち、いちばん遠いもの */
    }else if(seen<fbAge){fbAge=seen;fallback=i}  /* 全部が最近なら、いちばん昔のもの */
  }
  if(best<0)best=fallback;
  if(best>=0)focusTo(best);
}

/* どこから出てくるか。他の語からいちばん離れて見える角度を選ぶ */
function openAngle(self){
  var best=0,bs=-1;
  for(var k=0;k<16;k++){
    var a=k/16*Math.PI*2;
    var x=Math.cos(a)*self.rx, y=Math.sin(a)*self.ry;
    var near=1e9;
    for(var i=0;i<live.length;i++){
      var l=live[i];
      if(l===self||l.x===undefined)continue;
      var d=Math.hypot(l.x-x,(l.y-y)*2.2);   /* 縦に近いほど重なって見える */
      if(d<near)near=d;
    }
    if(near>bs){bs=near;best=a}
  }
  return best;
}

/* 1語だけ、いま focus から遠いものを消して別の語に替える */
function swapOne(){
  if(swapping)return;
  var cand=-1,old=1e18;
  for(var i=0;i<live.length;i++){
    if(i===focusI)continue;
    if(live[i].born<old){old=live[i].born;cand=i}
  }
  if(cand<0)return;
  swapping=true;
  var l=live[cand];
  l.el.classList.add('out');
  setTimeout(function(){
    l.wi=freeWord();
    l.born=performance.now();
    l.inner.textContent=WORDS[l.wi].w;
    l.a=openAngle(l);
    l.ph=Math.random()*6.28;
    draw2(performance.now());
    l.el.classList.remove('out');
    swapping=false;
  },760);
}

function running(){
  return !document.hidden && pane===0 && speak.getAttribute('data-state')==='idle' && !openId;
}
var half=false;
function frame(t){
  raf=null;
  if(!running()){lastT=0;return}
  var dt=lastT?Math.min(t-lastT,120):16;
  lastT=t;
  for(var i=0;i<live.length;i++)live[i].a+=live[i].sp*dt;
  spread(dt);
  draw2(t);
  half=!half;
  if(half&&blobPath)blobPath.setAttribute('d',blobD(t));
  pickFocus(t);
  raf=requestAnimationFrame(frame);
}
function start(){
  if(!beat)beat=setInterval(function(){if(running())swapOne()},SWAP_MS);
  if(reduced||raf||!running())return;
  lastT=0;
  raf=requestAnimationFrame(frame);
}
function stop(){if(raf){cancelAnimationFrame(raf);raf=null}lastT=0}
/* 動かさない設定のときは、位置は固定して問いだけ移す */
function rotateFocusSlowly(){
  var i=0;
  focusTo(0);
  setInterval(function(){if(running()){i=(i+1)%live.length;focusTo(i)}},7000);
}

/* iOS は、押したのと同じ処理の中で focus しないとキーボードが出ない。
   setTimeout を挟むと開かないので、ここは必ず同期で書く。 */
function openInput(){
  seed=(focusI>=0&&live[focusI])?WORDS[live[focusI].wi].w:'';
  stop();
  speak.setAttribute('data-state','talk');
  $('tip').textContent='';
  try{
    said.focus();
    var r=document.createRange();r.selectNodeContents(said);r.collapse(false);
    var s=window.getSelection();s.removeAllRanges();s.addRange(r);
  }catch(e){}
  fit();
  if(!state.entries.length&&!hinted){hinted=true;say('キーボードの🎤を押して、そのまま喋る')}
}
var hinted=false;
function closeInput(){
  speak.setAttribute('data-state','idle');
  try{said.blur()}catch(e){}
  $('tip').textContent=state.entries.length?'':'press';
  start();
}

/* 長く喋るので、読ませる字ではなく「入っている」ことが見える字にする。
   全体が一度に目に入るところまで自分で縮める（下限 8px）。 */
function fit(){
  said.style.fontSize='';
  var box=said.clientHeight;if(!box)return;
  var size=20;
  said.style.fontSize=size+'px';
  while(said.scrollHeight>box&&size>8){size-=size>13?1:0.5;said.style.fontSize=size+'px'}
  said.scrollTop=said.scrollHeight;
}
said.addEventListener('input',function(){
  fit();
  var n=text().length;
  $('mLen').textContent=n?n+'字':'';
});
function text(){return (said.innerText||said.textContent||'').replace(/\u00a0/g,' ').replace(/[ \t]+\n/g,'\n').trim()}

$('dropBtn').addEventListener('click',closeInput);
$('clear').addEventListener('click',function(){
  var keep=text();
  said.textContent='';$('mLen').textContent='';fit();
  if(keep)say('消した','undo',function(){said.textContent=keep;fit();$('mLen').textContent=keep.length+'字'});
});

$('keepBtn').addEventListener('click',function(){
  var t=text();
  if(t.length<4){say('ひとことだけでも');return}
  var e={id:uid(),createdAt:nowIso(),day:today(),seed:seed,raw:t,
         lines:[],digest:'',tags:[],picks:[],asks:[],notes:[],status:'draft'};
  state.entries.push(e);save();
  said.textContent='';$('mLen').textContent='';
  closeInput();
  seed='';
  fly(t);
  draw();
  shape(e);
});

/* 置いた言葉が記録の方角へ飛ぶ */
function fly(t){
  if(reduced)return;
  var el=document.createElement('div');el.className='fly';
  el.textContent=t.length>12?t.slice(0,12)+'…':t;
  el.style.left='50%';el.style.top='50%';el.style.transform='translate(-50%,-50%) scale(1)';el.style.opacity='1';
  document.body.appendChild(el);
  requestAnimationFrame(function(){requestAnimationFrame(function(){
    el.style.transform='translate('+(window.innerWidth*0.62)+'px,-52%) scale(.34)';el.style.opacity='0';
  })});
  setTimeout(function(){el.remove()},700);
}

/* キーボードのぶんだけ下を空ける。dvh はキーボードに反応しないので visualViewport を見る */
function syncKb(){
  var vv=window.visualViewport;if(!vv)return;
  var kb=Math.max(0,Math.round(window.innerHeight-vv.height-vv.offsetTop));
  document.documentElement.style.setProperty('--kb',kb+'px');
  document.body.classList.toggle('kb',kb>80);
  fit();
}
if(window.visualViewport){
  window.visualViewport.addEventListener('resize',syncKb);
  window.visualViewport.addEventListener('scroll',syncKb);
}
said.addEventListener('blur',function(){setTimeout(syncKb,80)});

/* 全画面アプリは閉じても再読み込みされず、前の画面のまま戻る。
   20秒以上離れていたら、書きかけが無いときだけ待機状態へ戻す。 */
var hiddenAt=0;
document.addEventListener('visibilitychange',function(){
  if(document.hidden){hiddenAt=Date.now();return}
  if(hiddenAt&&Date.now()-hiddenAt>20000){
    if(speak.getAttribute('data-state')==='talk'&&!text())closeInput();
  }
  hiddenAt=0;
  start();
});

/* ───────── Claude（整形と洞察） ─────────
   鍵はこの端末の localStorage にだけ置き、api.anthropic.com 以外へは送らない。
   鍵が無いときは手元の規則だけで整形する（アプリは鍵なしでも通しで使える）。 */
var MODEL='claude-opus-5';
function apiKey(){return String(state.settings.key||'').trim()}

function ask(system,user,opt){
  opt=opt||{};
  var key=apiKey();
  if(!key)return Promise.reject({kind:'nokey'});
  return fetch('https://api.anthropic.com/v1/messages',{
    method:'POST',
    headers:{
      'content-type':'application/json',
      'x-api-key':key,
      'anthropic-version':'2023-06-01',
      // ブラウザから直接呼ぶための許可。これが無いと CORS で弾かれる
      'anthropic-dangerous-direct-browser-access':'true'
    },
    body:JSON.stringify({
      model:MODEL,
      max_tokens:opt.max||8000,
      output_config:{effort:opt.effort||'low'},
      system:system,
      messages:[{role:'user',content:user}]
    })
  }).then(function(r){
    if(!r.ok)return r.text().then(function(b){throw {kind:'http',status:r.status,body:b}});
    return r.json();
  }).then(function(j){
    if(j.stop_reason==='refusal')throw {kind:'refusal'};
    var t=(j.content||[]).filter(function(b){return b.type==='text'})
                         .map(function(b){return b.text}).join('\n');
    return t;
  });
}
/* 前後に文が付いても拾えるように、最初の { から最後の } までを見る */
function json(t){
  var a=t.indexOf('{'),b=t.lastIndexOf('}');
  if(a<0||b<=a)throw new Error('no json');
  return JSON.parse(t.slice(a,b+1));
}
function strs(v,n){
  if(!Array.isArray(v))return [];
  return v.map(function(x){return String(x==null?'':x).trim()}).filter(Boolean).slice(0,n||20);
}
function pairs(v,n){
  if(!Array.isArray(v))return [];
  return v.map(function(x){
    if(!x)return null;
    if(typeof x==='string')return {t:x.trim(),d:''};
    var t=String(x.t||x.title||'').trim(),d=String(x.d||x.detail||x.body||'').trim();
    return (t||d)?{t:t,d:d}:null;
  }).filter(Boolean).slice(0,n||6);
}

var SHAPE_SYS=[
'あなたは、話し手の独り言を本人が読み返せる一次情報に整える書き起こし係。',
'',
'守ること:',
'- 内容を評価・解釈・要約しない。言われたことだけを残す。',
'- 言いよどみ（えー、なんか、あの、みたいな、的な）と言い直しの前半は落とす。',
'- 話された順は変えない。事実も気持ちも取りこぼさない。',
'- 1項目1事。日本語として読める文にする。体言止めでよい。',
'- 話者が言っていないことは足さない。判断も助言もしない。',
'',
'JSONだけを返す。前後に文を付けない。',
'{"lines":["…"],"digest":"…"}',
'lines: 箇条書きの原本。数の上限なし。話された全部を入れる。',
'digest: 3〜5文。その日に何があって何を考えたかが一読で分かるまとめ。'
].join('\n');

var REFLECT_SYS=[
'あなたは、日記を書く人の探究を進める相棒。渡された箇条書きの中から、本人がまだ言葉にしていない発見を拾う。',
'',
'守ること:',
'- picks（洞察）: 本人の言葉の中にある発見を2〜4個。t は短い見出し、d は何がなぜ面白いかを1〜2文。',
'  一般論や説教を書かない。本人が言っていないことを本人の考えとして書かない。',
'- asks（次の問い）: 次の探究テーマにつながる問いを2〜3個。答えではなく問い。抽象的にしない。',
'- notes（知識の補足）: 事実だけを1〜3個。t は名前や語、d は1〜2文。不確かなら入れない（空配列でよい）。',
'- tags（洞察の見出し）: 1〜3個。# は付けない。2〜10文字の日本語の名詞句。',
'  分類名（仕事・健康・人間関係）ではなく、その日固有の概念にする。',
'',
'JSONだけを返す。前後に文を付けない。',
'{"tags":[""],"picks":[{"t":"","d":""}],"asks":[""],"notes":[{"t":"","d":""}]}'
].join('\n');

/* 鍵が無いときの整形。喋りを文で割って、言いよどみを落とすだけ。 */
var FILL=/^(えーと|えっと|えー|あのー|あの|うーん|んー|なんか|そうだな|やっぱり|ていうか|というか|まあ|ま)[、,。\s]*/;
function shapeLocal(raw){
  var parts=String(raw).replace(/\r/g,'').split(/[。\n]+|(?<=[！？!?])/);
  var lines=[];
  parts.forEach(function(p){
    var s=p.replace(/\s+/g,' ').trim();
    for(var i=0;i<3;i++)s=s.replace(FILL,'');
    s=s.trim();
    if(s.length<3)return;
    if(!/[。！？!?、]$/.test(s))s+='。';
    lines.push(s);
  });
  if(!lines.length)lines=[String(raw).trim()];
  return {lines:lines,digest:lines.slice(0,4).join('')};
}
/* 鍵が無いときの見出し。語の切り出しだけで、洞察は作らない（作れないものを作らない） */
function tagsLocal(lines){
  var text=lines.join(' ');
  var re=/[\u3005\u3006\u4E00-\u9FFF\u30A1-\u30FF\uFF66-\uFF9FA-Za-z]{2,10}/g,m,c={};
  while((m=re.exec(text))!==null)c[m[0]]=(c[m[0]]||0)+1;
  return Object.keys(c).sort(function(a,b){return c[b]-c[a]||b.length-a.length}).slice(0,2);
}

function shape(e){
  e.busy=true;draw();
  var user='つぎの独り言を整える。'+(e.seed?'（入口の語: '+e.seed+'）':'')+'\n\n'+e.raw;
  ask(SHAPE_SYS,user,{effort:'low',max:8000}).then(function(t){
    var o=json(t);
    e.lines=strs(o.lines,200);
    e.digest=String(o.digest||'').trim();
    if(!e.lines.length||!e.digest)throw new Error('empty');
    e.status='draft';e.busy=false;save();draw();
  }).catch(function(err){
    var o=shapeLocal(e.raw);
    e.lines=o.lines;e.digest=o.digest;e.busy=false;save();draw();
    if(err&&err.kind==='nokey')say('鍵がまだ無いので、そのまま並べた');
    else say(why(err)+' — 手元の整形で置いた','retry',function(){shape(e)});
  });
}

function reflect(e){
  e.busy=true;drawSheet(e);draw();
  var user=['日付: '+e.day,e.seed?'入口の語: '+e.seed:'','','箇条書き:',
            e.lines.map(function(l){return '- '+l}).join('\n'),'','まとめ:',e.digest]
           .filter(function(x){return x!==''}).join('\n');
  ask(REFLECT_SYS,user,{effort:'high',max:6000}).then(function(t){
    var o=json(t);
    e.picks=pairs(o.picks,4);
    e.asks=strs(o.asks,3);
    e.notes=pairs(o.notes,3);
    e.tags=strs(o.tags,3).map(function(s){return s.replace(/^#/,'')});
    if(!e.tags.length)e.tags=tagsLocal(e.lines);
    if(e.status==='draft')e.status='read';
    e.busy=false;save();drawSheet(e);draw();
  }).catch(function(err){
    e.busy=false;
    if(err&&err.kind==='nokey'){
      e.tags=tagsLocal(e.lines);
      if(e.status==='draft')e.status='read';
      save();drawSheet(e);draw();
      say('洞察には鍵がいる。記録面のいちばん下に入れて。','key',function(){closeSheet();goPane(1);setTimeout(function(){$('keyIn').focus()},420)});
    }else{
      drawSheet(e);
      say(why(err),'retry',function(){reflect(e)});
    }
  });
}
function why(err){
  if(!err)return 'つながらなかった';
  if(err.kind==='refusal')return '返答が断られた';
  if(err.kind==='http'){
    if(err.status===401)return '鍵が通らなかった';
    if(err.status===429)return '呼びすぎ。少し待って';
    if(err.status>=500)return 'むこうが落ちている';
    return 'エラー '+err.status;
  }
  return 'つながらなかった';
}

/* ───────── 記録の面 ───────── */
var filter='';
function kept(){return state.entries.filter(function(e){return e.status==='kept'})}
function tagCount(){
  var c={};
  kept().forEach(function(e){e.tags.forEach(function(t){c[t]=(c[t]||0)+1})});
  return c;
}
function streak(){
  var days={};state.entries.forEach(function(e){days[e.day]=1});
  var d=new Date(),n=0;
  if(!days[ymd(d)]){d.setDate(d.getDate()-1);if(!days[ymd(d)])return 0}
  while(days[ymd(d)]){n++;d.setDate(d.getDate()-1)}
  return n;
}
function draw(){
  var days={};state.entries.forEach(function(e){days[e.day]=1});
  var tc=tagCount(),tags=Object.keys(tc);
  $('cDays').textContent=Object.keys(days).length;
  $('cRow').textContent=streak();
  $('cTag').textContent=tags.length;

  var cloud=$('cloud');cloud.innerHTML='';
  tags.sort(function(a,b){return tc[b]-tc[a]||(a<b?-1:1)}).slice(0,14).forEach(function(t){
    var b=document.createElement('button');
    b.className='tag'+(tc[t]>=3?' big':tc[t]===2?' mid':'')+(filter===t?' on':'');
    b.innerHTML='#'+esc(t)+(tc[t]>1?'<em>'+tc[t]+'</em>':'');
    b.addEventListener('click',function(){filter=filter===t?'':t;draw()});
    cloud.appendChild(b);
  });

  var list=$('list');list.innerHTML='';
  var rows=state.entries.filter(function(e){return !filter||e.tags.indexOf(filter)>=0});
  if(!rows.length){
    var p=document.createElement('div');p.className='empty';
    p.textContent=filter?'この見出しはまだ無い':(state.entries.length?'':'◯ を押して、今日を喋る');
    list.appendChild(p);
    drawKey(list);
    return;
  }

  var ax=document.createElement('div');ax.className='axis';
  ax.innerHTML='<span>0</span><span>6</span><span>12</span><span>18</span><span>24</span>';
  list.appendChild(ax);

  var byDay={};
  rows.forEach(function(e){(byDay[e.day]=byDay[e.day]||[]).push(e)});
  var have=Object.keys(byDay).sort();
  var oldest=have[0],cur=today(),gap=0,guard=0;
  /* 書いた日だけを詰めて出すと、間が空いたことが見えない。
     空いた日はまとめて1行にして、続いているかどうかが分かるようにする。 */
  while(cur>=oldest&&guard++<500){
    if(byDay[cur]){
      if(gap){list.appendChild(gapRow(gap));gap=0}
      list.appendChild(dayRow(cur,byDay[cur]));
    }else gap++;
    cur=prevDay(cur);
  }
  if(gap)list.appendChild(gapRow(gap));

  drawKey(list);
}
function prevDay(iso){
  var p=iso.split('-'),d=new Date(+p[0],+p[1]-1,+p[2]);
  d.setDate(d.getDate()-1);
  return ymd(d);
}
function minutes(iso){
  var m=/T(\d\d):(\d\d)/.exec(iso||'');
  return m?(+m[1])*60+(+m[2]):12*60;
}
function gapRow(n){
  var g=document.createElement('div');g.className='gap';
  g.innerHTML='<hr><span>'+n+'日</span><hr>';
  return g;
}
function dayRow(day,list){
  var es=list.slice().sort(function(a,b){return minutes(a.createdAt)-minutes(b.createdAt)});
  var wrap=document.createElement('div');wrap.className='dayrow';

  var h=document.createElement('div');h.className='dh';
  var p=day.split('-'),lab=dayLabel(day);
  var sub=/^\d/.test(lab)?'':((+p[1])+'/'+(+p[2]));   /* 今日・昨日だけ、日付を添える */
  h.innerHTML='<b>'+esc(lab)+'</b>'+(sub?'<span>'+sub+'</span>':'')+
              (es.length>1?'<em>'+es.length+'</em>':'');
  wrap.appendChild(h);

  var tr=document.createElement('div');tr.className='tr'+(day===today()?' now':'');
  [6,12,18].forEach(function(hh){
    var t=document.createElement('i');t.className='tick';t.style.left=(hh/24*100)+'%';
    tr.appendChild(t);
  });
  /* 同じころに書いたものが重なって1点に見えないよう、近いものは上下に散らす */
  var lastX=-99,step=0;
  es.forEach(function(e){
    var x=minutes(e.createdAt)/1440*100;
    x=Math.max(2.5,Math.min(97.5,x));
    if(x-lastX<5)step=step>0?-1:(step<0?2:1);else step=0;
    lastX=x;
    var b=document.createElement('button');
    b.className='pt'+(e.status==='kept'?' kept':'')+(e.busy?' slow':'')+
               (filter&&e.tags.indexOf(filter)>=0?' hit':'');
    b.style.left=x+'%';
    b.style.marginTop=(-5.5+step*8)+'px';
    b.setAttribute('aria-label',hhmm(e.createdAt)+'　'+(e.digest||e.raw).slice(0,24));
    b.addEventListener('click',function(){openSheet(e)});
    tr.appendChild(b);
  });
  wrap.appendChild(tr);

  var items=document.createElement('div');items.className='items';
  es.forEach(function(e){
    var it=document.createElement('button');it.className='it';
    var tg=e.tags.length?'<div class="tg">'+e.tags.map(function(t){return '<s>'+esc(t)+'</s>'}).join('')+'</div>':'';
    var st=e.busy?'<span class="st">整えている…</span>':
           (e.status==='draft'?'<span class="st">まだ読んでいない</span>':
           (e.status==='read'?'<span class="st">まだ保存していない</span>':''));
    it.innerHTML='<u>'+hhmm(e.createdAt)+'</u><div><p>'+esc(e.digest||e.raw)+'</p>'+tg+st+'</div>';
    it.addEventListener('click',function(){openSheet(e)});
    items.appendChild(it);
  });
  wrap.appendChild(items);
  return wrap;
}
function drawKey(list){
  var w=document.createElement('div');w.className='key';
  w.innerHTML='<h3 class="lo">key</h3><div class="row">'+
    '<input id="keyIn" type="password" inputmode="text" autocomplete="off" spellcheck="false" placeholder="sk-ant-…">'+
    '<button id="keySave" class="lo">save</button></div>'+
    '<p>整形と洞察に Claude（'+MODEL+'）を使う。鍵はこの端末のブラウザにだけ残り、api.anthropic.com 以外へは送らない。'+
    '鍵が無くても、喋った内容は箇条書きにして残る。</p>';
  list.appendChild(w);
  var input=$('keyIn');
  input.value=apiKey()?'········································':'';
  $('keySave').addEventListener('click',function(){
    var v=input.value.trim();
    if(/^·+$/.test(v))return;
    if(!v){state.settings.key='';save();say('鍵を消した');draw();return}
    state.settings.key=v;save();say('鍵を入れた');draw();
  });
}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}

/* ───────── ひらく面 ─────────
   まとめを押すと洞察が出る。洞察が出てから keep で日記として並ぶ。 */
var sheet=$('sheet'),openId='';
function openSheet(e){
  openId=e.id;
  stop();
  sheet.classList.add('on');sheet.setAttribute('aria-hidden','false');
  track.classList.add('lock');
  drawSheet(e);
}
function closeSheet(){
  openId='';
  if(pane===0)start();
  sheet.classList.remove('on');sheet.setAttribute('aria-hidden','true');
  track.classList.remove('lock');
}
$('sClose').addEventListener('click',closeSheet);

function drawSheet(e){
  if(!e||e.id!==openId)return;
  $('sWhen').textContent=dayLabel(e.day)+' '+hhmm(e.createdAt)+(e.seed?' · '+e.seed:'');
  var b=$('sBody');b.innerHTML='';

  var d=document.createElement('button');
  d.className='digest';d.textContent=e.digest||e.raw;
  d.addEventListener('click',function(){if(!e.busy&&!e.picks.length)reflect(e)});
  b.appendChild(d);

  if(e.busy){
    var w=document.createElement('div');w.className='busy';
    w.innerHTML='<i class="dot slow"></i><span>読んでいる…</span>';
    b.appendChild(w);
  }else if(!e.picks.length&&!e.asks.length){
    var h=document.createElement('p');h.className='hint';
    h.textContent=apiKey()?'↑ このまとめを押すと、洞察を拾う':'鍵を入れると、ここに洞察と次の問いが出る';
    b.appendChild(h);
  }

  if(e.tags.length){
    var t=document.createElement('div');t.className='cloud';t.style.margin='26px 0 0';
    t.innerHTML=e.tags.map(function(x){return '<span class="tag">#'+esc(x)+'</span>'}).join('');
    b.appendChild(t);
  }
  if(e.picks.length)b.appendChild(sec('found',e.picks.map(function(p){
    return '<div class="pick"><b>'+esc(p.t)+'</b><span>'+esc(p.d)+'</span></div>'}).join('')));
  if(e.asks.length)b.appendChild(sec('next',e.asks.map(function(a){
    return '<div class="ask2">'+esc(a)+'</div>'}).join('')));
  if(e.notes.length)b.appendChild(sec('notes',e.notes.map(function(n){
    return '<div class="note"><b>'+esc(n.t)+'</b>　'+esc(n.d)+'</div>'}).join('')));

  if(e.lines.length){
    var o=document.createElement('div');o.className='sec';
    o.innerHTML='<h4 class="lo">origin</h4><ul class="origin">'+
      e.lines.map(function(l){return '<li>'+esc(l)+'</li>'}).join('')+'</ul>';
    var f=document.createElement('button');f.className='fold lo';f.textContent='raw';
    var raw=document.createElement('p');raw.className='raw';raw.hidden=true;raw.textContent=e.raw;
    f.addEventListener('click',function(){raw.hidden=!raw.hidden});
    o.appendChild(f);o.appendChild(raw);
    b.appendChild(o);
  }

  var foot=$('sFoot');foot.innerHTML='';
  if(e.status!=='kept'){
    var k=document.createElement('button');k.className='keep lo';k.textContent='keep';
    k.addEventListener('click',function(){
      if(!e.tags.length&&!e.picks.length){reflect(e);return}
      e.status='kept';save();draw();closeSheet();
      say(e.tags.length?'#'+e.tags[0]+' で並べた':'並べた');
    });
    foot.appendChild(k);
  }
  var f2=document.createElement('button');f2.className='thin lo';f2.textContent='forget';
  f2.addEventListener('click',function(){
    say('この日記を消す？','yes',function(){
      var i=state.entries.indexOf(e);
      if(i>=0){var back=state.entries.splice(i,1)[0];save();draw();closeSheet();
        say('消した','undo',function(){state.entries.push(back);save();draw()})}
    });
  });
  foot.appendChild(f2);
}
function sec(title,html){
  var s=document.createElement('div');s.className='sec';
  s.innerHTML='<h4 class="lo">'+title+'</h4>'+html;
  return s;
}
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&openId)closeSheet()});

/* ロゴ。アイコンと同じ形（アメーバを脈が貫き、内側では地の色に反転する） */
(function(){
  var m=$('mark');if(!m)return;
  var seam='M4 92 L34 66 L66 34 L96 8';
  m.innerHTML='<defs><clipPath id="mkc"><path d="'+blobD(0)+'"/></clipPath></defs>'+
    '<path d="'+blobD(0)+'" fill="currentColor"/>'+
    '<path d="'+seam+'" fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round"/>'+
    '<path d="'+seam+'" fill="none" stroke="var(--void)" stroke-width="6" stroke-linecap="round" clip-path="url(#mkc)"/>';
})();

/* ───────── 立ち上げ ───────── */
place();
draw();
$('tip').textContent=state.entries.length?'':'press';
goPane(0,false);
/* 途中で閉じたまま整形が終わっていない下書きを、開き直したときに拾い直す */
state.entries.forEach(function(e){if(!e.digest&&e.raw)shape(e)});
})();
</script>
<script>
if('serviceWorker' in navigator){
  window.addEventListener('load',function(){
    // updateViaCache:'none' を付けないと sw.js 自体が HTTP キャッシュから返り、
    // 直したはずのものが端末に届かない状態が続く
    navigator.serviceWorker.register('./sw.js',{updateViaCache:'none'})
      .then(function(reg){ reg.update(); })
      .catch(function(){});
  });
}
</script>
