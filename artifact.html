<title>journaling</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+2:wght@300;400;500&display=swap">
<style>
/* ── 昼の紙の地。ember（黒地・残り火）や aloud と分けるため、白トーン＋鉱石の色 ──
   --acc  照りのある赤錆＝掘り当てたもの（洞察・見出し）
   --acc2 緑青＝次へ渡すもの（問い）
   地は真っ白ではなく、わずかに温かい紙。字は黒ではなく墨。 */
/* ── 紙と墨だけ。ember（黒地）と分けるために地は白トーン。
   色で差を付けず、濃さ・大きさ・余白で差を付ける。 */
:root{
  color-scheme: light;
  --void:#F4F2EE;          /* 紙 */
  --void2:#FFFFFF;         /* 浮くもの（通知・面） */
  --lume:#14120F;          /* 墨 */
  --l86:rgba(20,18,15,.86);
  --l58:rgba(20,18,15,.58);
  --l40:rgba(20,18,15,.40);
  --l26:rgba(20,18,15,.26);
  --l16:rgba(20,18,15,.16);
  --l09:rgba(20,18,15,.09);
  --l05:rgba(20,18,15,.045);
  /* 「アクセント」は色ではなく墨そのもの。使う場所だけ決めておく */
  --acc:#14120F;
  --acc86:rgba(20,18,15,.86);
  --acc40:rgba(20,18,15,.34);
  --acc16:rgba(20,18,15,.13);
  --acc08:rgba(20,18,15,.05);
  --acc2:rgba(20,18,15,.40);
  --f:"M PLUS 2",-apple-system,'Hiragino Sans','Helvetica Neue',sans-serif;
  --ease:cubic-bezier(.2,.9,.25,1);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--void);color:var(--lume);font-family:var(--f);overscroll-behavior:none}
body{font-size:15px;font-weight:400;line-height:1.7;letter-spacing:.01em;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input{font:inherit;color:inherit;background:none;border:0}
:focus-visible{outline:1px solid var(--l58);outline-offset:3px}
/* 英字ラベルの共通の置き方（読ませるためではなく、添えるために置く） */
.lo{text-transform:lowercase;letter-spacing:.28em;text-indent:.28em}

/* ── 2面トラック：左=話す 右=記録 ── */
.track{display:flex;height:100dvh;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.track::-webkit-scrollbar{display:none}
.track.lock{overflow-x:hidden}
.pane{position:relative;flex:0 0 100%;height:100dvh;scroll-snap-align:center;scroll-snap-stop:always;overflow:hidden}

.dots{position:fixed;left:0;right:0;bottom:max(16px,env(safe-area-inset-bottom));display:flex;gap:7px;justify-content:center;z-index:40;pointer-events:none;transition:opacity .3s}
.dots i{width:4px;height:4px;border-radius:50%;background:var(--l16);transition:background .3s,width .3s var(--ease)}
.dots i.on{background:var(--acc);width:14px;border-radius:2px}
body.kb .dots{opacity:0}

/* ── 話す面 ── */
#speak{display:flex;flex-direction:column;
  padding:calc(env(safe-area-inset-top) + 10px) 20px calc(env(safe-area-inset-bottom) + 46px);
  padding-bottom:calc(env(safe-area-inset-bottom) + 46px + var(--kb,0px));
  transition:padding-bottom .22s var(--ease)}

/* ── 語の野 ──
   語は丸のまわりを回りつづけ、ときどき消えて別の語に入れ替わる。
   下（問いのすぐ上）を通る語が focus になり、問いがひとりでに変わる。
   **語は触れる。押した語の問いだけが下に出る。**
   勝手に入れ替わる問いは、読む先が定まらないのでやめた。 */
.field{position:relative;flex:1 1 auto;min-height:0;opacity:1;transition:opacity .3s}
#speak[data-state="talk"] .field{opacity:0;pointer-events:none;position:absolute;inset:0}
.word{position:absolute;left:50%;top:48%;padding:12px 12px;margin:-12px 0 0 0;
  font-size:13px;font-weight:400;color:var(--l26);text-transform:lowercase;letter-spacing:.2em;
  white-space:nowrap;will-change:transform;touch-action:manipulation;
  transition:color .4s,opacity .7s var(--ease)}
.word:active{color:var(--l58)}
.word i{display:block;font-style:normal;transition:transform .55s var(--ease)}
.word.on{color:var(--acc86)}
.word.on i{transform:scale(1.42)}
#speak.deep-on .word{pointer-events:none}
.word.out{opacity:0}
.word.out i{transform:scale(.72)}

/* 真ん中。平らな墨1色。輪郭だけがアメーバのように歪みつづける（生きている）。
   球にもグラデーションにも影にもしない。輪も広げない。 */
.orbwrap{position:absolute;left:50%;top:48%;width:96px;height:96px;margin:-48px 0 0 -48px}
.orb{position:absolute;inset:0;padding:0;border:0;background:none;touch-action:manipulation;
  transition:transform .2s var(--ease)}
.orb svg{display:block;width:100%;height:100%;overflow:visible}
.orb path{fill:var(--lume)}
.orb.press{transform:scale(.94)}

/* ── 深い問いの層 ──
   ◯ の面を下から上へなぞると開き、なぞるたびに次が出る。上から下へなぞると ◯ に戻る。
   触る場所は増やさない（開いているあいだも、押せるのは真ん中だけ）。 */
.deep{position:absolute;left:0;right:0;
  top:calc(env(safe-area-inset-top) + 12px);bottom:0;
  display:grid;place-items:center;align-content:center;
  padding:0 28px 14vh;pointer-events:none;opacity:0;transition:opacity .34s}
.deep.on{opacity:1}
.dcard{max-width:21em;text-align:center}
.dl{display:block;font-size:9.5px;color:var(--l26);margin-bottom:22px}
.dq{margin:0;font-weight:300;font-size:clamp(20px,5.6vw,26px);line-height:1.6;
  letter-spacing:-.01em;text-wrap:balance;word-break:auto-phrase;color:var(--lume)}
/* 背景。何を訊かれているのかが分かるように、問いの下に添える */
.dn{margin:26px auto 0;max-width:22em;padding-top:20px;border-top:1px solid var(--l09);
  font-size:12.5px;line-height:1.95;color:var(--l40);text-align:left;word-break:auto-phrase}
.ds{display:block;margin-top:12px;font-size:10px;letter-spacing:.04em;color:var(--l26);text-align:left}
.dcard.in{animation:rise .42s var(--ease) both}
@keyframes rise{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:none}}
/* 層が開いているあいだ、語は引っ込み、丸は下へ降りて小さくなる（押せば、その問いで喋り出せる） */
#speak.deep-on .word{opacity:0}
#speak.deep-on .orbwrap{top:82%;width:58px;height:58px;margin:-29px 0 0 -29px}
#speak.deep-on .ask{opacity:0}
/* 引き上げられる、という気配だけ置く */
.pull{position:absolute;left:50%;bottom:calc(30px + env(safe-area-inset-bottom));
  width:26px;height:2px;border-radius:1px;background:var(--l16);
  transform:translateX(-50%);pointer-events:none;
  animation:nudge 5.2s ease-in-out infinite}
#speak[data-state="talk"] .pull,#speak.deep-on .pull{animation:none;opacity:0}
@keyframes nudge{0%,100%{transform:translate(-50%,0);opacity:.28}50%{transform:translate(-50%,-5px);opacity:.9}}

/* 問い。focus が移るたび、ひとりでに書き替わる */
.ask{flex:0 0 auto;min-height:3.2em;display:flex;align-items:center;justify-content:center;
  text-align:center;font-weight:300;font-size:16.5px;line-height:1.62;color:var(--l58);
  word-break:auto-phrase;opacity:0;transition:opacity .42s}
.ask.on{opacity:1}
#speak[data-state="talk"] .ask{display:none}

@media (prefers-reduced-motion: reduce){
  .word,.word i{transition:none}
}

/* 喋ったものが出る面。長い文でも全部が一度に目に入るよう、字を自分で縮める。
   読むためではなく「入っている」ことが見えるための字。 */
.said{flex:1 1 auto;min-height:0;width:100%;overflow:hidden;
  font-weight:300;font-size:20px;line-height:1.62;letter-spacing:-.005em;
  word-break:auto-phrase;white-space:pre-wrap;
  -webkit-mask-image:linear-gradient(180deg,transparent 0,#000 22px);
  mask-image:linear-gradient(180deg,transparent 0,#000 22px);
  display:none}
#speak[data-state="talk"] .said{display:block}
.said:focus{outline:none}
.said:empty::before{content:"speak";color:var(--l16);font-size:12px;letter-spacing:.34em}
.meta{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;
  height:0;opacity:0;overflow:hidden;font-size:10.5px;color:var(--l26);transition:opacity .3s}
#speak[data-state="talk"] .meta{height:22px;opacity:1}
.acts{flex:0 0 auto;display:flex;align-items:center;justify-content:center;gap:26px;
  max-height:0;opacity:0;margin-top:0;overflow:hidden;
  transition:max-height .3s var(--ease),opacity .24s,margin-top .3s var(--ease)}
#speak[data-state="talk"] .acts{max-height:80px;opacity:1;margin-top:18px}
.keep{min-height:52px;padding:0 42px;border-radius:26px;border:0;background:var(--lume);color:var(--void);
  font-size:13px;font-weight:500;transition:transform .18s var(--ease)}
.keep:active{transform:scale(.97)}
.thin{color:var(--l40);font-size:12px}
.thin:active{color:var(--l86)}
.tip{position:absolute;left:0;right:0;bottom:calc(20px + env(safe-area-inset-bottom));
  text-align:center;font-size:10px;color:var(--l16);pointer-events:none}
body.kb .tip{opacity:0}

/* ── 記録面 ── */
#log{display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
.head{flex:0 0 auto;padding:22px 22px 6px}
.count{display:flex;align-items:baseline;gap:20px;margin-bottom:14px}
.count b{font-weight:300;font-size:26px;letter-spacing:-.02em}
.count span{font-size:9.5px;color:var(--l26)}
.count i{font-style:normal;display:block}
.cloud{display:flex;flex-wrap:nowrap;gap:7px;overflow-x:auto;-webkit-overflow-scrolling:touch;
  scrollbar-width:none;padding-bottom:2px}
.cloud::-webkit-scrollbar{display:none}
.cloud .tag{flex:0 0 auto}
.tag{border:1px solid var(--l09);background:var(--l05);border-radius:14px;padding:4px 11px;
  font-size:12px;color:var(--l58);transition:color .2s,border-color .2s,background .2s}
.tag em{font-style:normal;color:var(--l16);margin-left:5px;font-size:10px}
.tag.on{color:var(--void2);background:var(--acc);border-color:var(--acc)}
.tag.on em{color:rgba(255,255,255,.55)}
.tag.big{font-size:15px;padding:6px 14px;color:var(--acc86);border-color:var(--acc16);background:var(--acc08)}
.tag.mid{font-size:13.5px}

.scroll{flex:1 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:10px 22px calc(70px + env(safe-area-inset-bottom))}

/* ── 記録＝日ごとの帯。1日を24時間の1本にして、書いた時刻に点を置く ──
   1日に何度でも書けるので、点が増えていくことが見えるようにしてある。 */
.axis{display:flex;justify-content:space-between;margin-top:10px;padding:0 0 6px;
  border-bottom:1px solid var(--l09);
  font-size:8.5px;letter-spacing:.06em;color:var(--l16)}
.mon{display:flex;align-items:center;gap:10px;margin:22px 0 14px}
.mon:first-child{margin-top:10px}
.mon b{font-weight:400;font-size:10px;letter-spacing:.08em;color:var(--l40)}
.mon hr{flex:1 1 auto;height:1px;border:0;background:var(--l09);margin:0}
.dayrow{margin:0 0 16px}
.dh{display:flex;align-items:baseline;gap:9px;margin-bottom:5px}
.dh b{font-weight:400;font-size:12px;color:var(--l58)}
.dh span{font-size:9.5px;color:var(--l16)}
.dh em{margin-left:auto;font-style:normal;font-size:9.5px;color:var(--l26)}
.tr{position:relative;height:28px}
.tr::before{content:"";position:absolute;left:0;right:0;top:50%;height:1px;background:var(--l09)}
.tr.now::before{background:var(--l16)}
.tick{position:absolute;top:50%;width:1px;height:7px;margin-top:-3.5px;background:var(--l09)}
.pt{position:absolute;top:50%;width:11px;height:11px;margin:-5.5px 0 0 -5.5px;border-radius:50%;
  background:var(--void);border:1px solid var(--l40);transition:transform .18s var(--ease)}
.pt.kept{background:var(--lume);border-color:var(--lume)}
.pt.hit{box-shadow:0 0 0 3px var(--l09)}
.pt.slow{animation:pulse 1.5s ease-in-out infinite}
.pt:active{transform:scale(1.4)}
.items{display:flex;flex-direction:column}
.it{display:flex;gap:10px;width:100%;text-align:left;padding:7px 0;border-top:1px solid var(--l05)}
.it:active{background:var(--l05)}
.it u{flex:0 0 2.9em;text-decoration:none;font-size:9.5px;color:var(--l26);padding-top:2px}
.it div{flex:1 1 auto;min-width:0}
.it p{margin:0;font-size:13px;line-height:1.62;color:var(--l86);word-break:auto-phrase;
  display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden}
.it .tg{display:flex;flex-wrap:wrap;gap:7px;margin-top:4px}
.it .tg s{text-decoration:none;font-size:10.5px;color:var(--acc)}
.it .tg s::before{content:"#";color:var(--acc40);margin-right:1px}
.it .st{font-size:9.5px;color:var(--l26);margin-top:4px;display:block}
.it .qa{display:block;font-size:10.5px;line-height:1.5;color:var(--l26);margin-bottom:3px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.yet{font-size:10px;color:var(--l16);padding:2px 0 0}
.gap{display:flex;align-items:center;gap:9px;margin:0 0 16px;font-size:9px;color:var(--l16)}
.gap hr{flex:1 1 auto;height:1px;border:0;background:var(--l05);margin:0}
.dot{width:5px;height:5px;border-radius:50%;background:var(--acc);flex:0 0 auto}
.dot.slow{animation:pulse 1.5s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.2}50%{opacity:1}}
.empty{text-align:center;color:var(--l16);font-size:11px;padding:64px 0}

/* ── 設定の面（鍵はここだけ。日記の並びには置かない） ── */
.set h3{margin:0 0 10px;font-weight:400;font-size:9.5px;color:var(--l40)}
.set .row{display:flex;gap:10px;align-items:center}
.set input{flex:1 1 auto;min-width:0;border-bottom:1px solid var(--l16);padding:9px 2px;font-size:13px}
.set input::placeholder{color:var(--l16)}
.set p{margin:12px 0 0;font-size:11px;line-height:1.85;color:var(--l40)}
.set .blk{margin-bottom:34px}
.set .paste{width:100%;min-height:78px;margin-bottom:12px;border:1px solid var(--l16);
  border-radius:12px;padding:10px 12px;font-size:11.5px;line-height:1.6;
  font-family:var(--f);background:var(--void2);resize:vertical}
.set .paste::placeholder{color:var(--l16)}
.set p b{font-weight:500;color:var(--l86)}
.set .wide{width:100%;min-height:46px;border:1px solid var(--l16);border-radius:23px;
  font-size:12px;letter-spacing:.06em;transition:background .2s}
.set .wide:active{background:var(--l05)}

/* ── ひらく面（1件の全体） ── */
.sheet{position:fixed;inset:0;z-index:60;background:var(--void);
  display:flex;flex-direction:column;transform:translateY(100%);transition:transform .38s var(--ease)}
.sheet.on{transform:none}
.mark{display:flex;align-items:center;gap:9px;margin-bottom:18px}
.mark svg{flex:0 0 auto}
.mark b{font-weight:400;font-size:14px}
/* さりげなく置くだけの印。▢＝うつす、···＝設定 */
.ic{flex:0 0 auto;width:30px;height:30px;display:grid;place-items:center;color:var(--l26);
  font-size:12px;line-height:1;letter-spacing:.12em;transition:color .2s}
.ic:active{color:var(--lume)}
.ic.sq{margin-left:auto}
.ic.sq i{display:block;width:11px;height:11px;border:1px solid currentColor;border-radius:2px}
.ic.sq.done i{background:currentColor}
.tops{display:flex;align-items:center;gap:4px}
.tops .ic{width:26px;height:26px}

.sheet .top{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;
  padding:calc(env(safe-area-inset-top) + 14px) 22px 10px;font-size:10px;color:var(--l26)}
.sheet .body{flex:1 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:6px 22px calc(30px + env(safe-area-inset-bottom))}
.sheet .foot{flex:0 0 auto;display:flex;align-items:center;justify-content:center;gap:24px;
  padding:12px 22px calc(14px + env(safe-area-inset-bottom));border-top:1px solid var(--l09)}

.sec{margin-top:32px}
.sec:first-child{margin-top:6px}
.sh{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.shl{display:flex;align-items:center;gap:8px;padding:4px 0;text-align:left}
.sh h4{margin:0;font-weight:400;font-size:9.5px;color:var(--l40)}
.shl em{font-style:normal;font-size:10px;color:var(--l26)}
.sh .ic{margin:0 -6px 0 0}

/* ① 話したこと＝面の頭。ここだけ字を大きく持つ */
.eask{margin:2px 0 26px;padding:2px 0 2px 14px;border-left:1px solid var(--l26);
  font-weight:300;font-size:14px;line-height:1.66;color:var(--l58);word-break:auto-phrase}
.bul+.bul{margin-top:20px}
.gh{margin:22px 0 9px;font-weight:400;font-size:11px;letter-spacing:.04em;color:var(--l58)}
.gh::before{content:"";display:inline-block;width:4px;height:4px;border-radius:50%;
  background:var(--l26);vertical-align:middle;margin:-2px 7px 0 0}
.sec>div>.gh:first-child{margin-top:0}
.bul{margin:0;padding:0;list-style:none}
.bul li{position:relative;padding-left:16px;margin-bottom:11px;
  font-weight:300;font-size:16.5px;line-height:1.72;letter-spacing:-.005em;word-break:auto-phrase}
.bul li::before{content:"";position:absolute;left:0;top:.82em;width:7px;height:1px;background:var(--l40)}

.origin{margin:0;padding:0;list-style:none}
.origin li{position:relative;padding-left:14px;margin-bottom:7px;font-size:13px;line-height:1.8;color:var(--l58);word-break:auto-phrase}
.origin li::before{content:"";position:absolute;left:0;top:.85em;width:5px;height:1px;background:var(--l26)}
.raw{font-size:11.5px;line-height:1.9;color:var(--l26);white-space:pre-wrap;word-break:auto-phrase;margin:0}

/* ── 通知 ── */
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translate(-50%,14px);
  z-index:80;display:flex;align-items:center;gap:16px;max-width:min(88vw,26em);
  padding:11px 17px;border-radius:20px;background:var(--void2);border:1px solid var(--l09);
  box-shadow:0 6px 24px rgba(20,18,15,.10);
  font-size:12.5px;line-height:1.6;opacity:0;pointer-events:none;transition:opacity .26s,transform .26s var(--ease)}
.toast.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast button{flex:0 0 auto;font-size:11px;color:var(--acc)}
.fly{position:fixed;z-index:70;pointer-events:none;font-size:15px;color:var(--l86);white-space:nowrap;
  transition:transform .62s var(--ease),opacity .62s ease-in}
</style>

<div class="track" id="track">

  <!-- ───────── 話す ───────── -->
  <section class="pane" id="speak" data-state="idle">
    <div class="field" id="field"></div>
    <div class="deep" id="deep" aria-hidden="true">
      <div class="dcard" id="dcard">
        <span class="dl lo" id="dLabel"></span>
        <p class="dq" id="dQ"></p>
        <p class="dn" id="dNote"></p>
        <span class="ds" id="dSrc"></span>
      </div>
    </div>
    <div class="ask" id="ask"></div>
    <div class="said" id="said" contenteditable="true" role="textbox" aria-label="話したこと" spellcheck="false"></div>
    <div class="meta"><span id="mLen"></span><button class="thin" id="clear">clear</button></div>
    <div class="acts">
      <button class="keep lo" id="keepBtn">keep</button>
      <button class="thin lo" id="dropBtn">close</button>
    </div>
    <div class="tip lo" id="tip"></div>
    <i class="pull" id="pull" aria-hidden="true"></i>
  </section>

  <!-- ───────── 記録 ───────── -->
  <section class="pane" id="log">
    <div class="head">
      <div class="mark">
        <svg id="mark" width="22" height="22" viewBox="0 0 100 100" aria-hidden="true"></svg>
        <b class="lo">journaling</b>
        <button class="ic sq" id="copyAll" aria-label="日記を全部うつす"><i></i></button>
        <button class="ic" id="openSet" aria-label="設定">···</button>
      </div>
      <div class="count">
        <span><b id="cDays">0</b><i class="lo">days</i></span>
        <span><b id="cRow">0</b><i class="lo">in a row</i></span>
        <span><b id="cTag">0</b><i class="lo">tags</i></span>
      </div>

<script>
(function(){
"use strict";
var $=function(id){return document.getElementById(id)};
var reduced=window.matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ───────── 日付（ローカル固定・UTCずれなし） ───────── */
function ymd(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function today(){return ymd(new Date())}
function nowIso(){
  var d=new Date(),o=-d.getTimezoneOffset(),s=o<0?'-':'+',a=Math.abs(o);
  return ymd(d)+'T'+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')+':'+String(d.getSeconds()).padStart(2,'0')
    +s+String(Math.floor(a/60)).padStart(2,'0')+':'+String(a%60).padStart(2,'0');
}
var WD=['日','月','火','水','木','金','土'];
function dayLabel(day){
  var p=day.split('-'),d=new Date(+p[0],+p[1]-1,+p[2]);
  var t=today();
  if(day===t)return '今日';
  var y=new Date();y.setDate(y.getDate()-1);
  if(day===ymd(y))return '昨日';
  return (+p[1])+'月'+(+p[2])+'日 '+WD[d.getDay()];
}
function hhmm(iso){var m=/T(\d\d:\d\d)/.exec(iso||'');return m?m[1]:''}
function uid(){return 'm'+Date.now().toString(36)+Math.random().toString(36).slice(2,8)}

/* ───────── 保存 ─────────
   日記は溜まり続けるものなので、1か所に置かない。

   1. localStorage（すぐ読める本体）
   2. IndexedDB（同じものの控え。iOS では localStorage より消されにくい）
   3. 日ごとの控え（murmur_snap_YYYY-MM-DD、直近10日ぶん）

   立ち上げのたびに全部を突き合わせて、**足し合わせたものを本体にする**。
   どれか1つが消えても、残りから戻る。消えるときも、黙って空では始めない。

   それでも消える場合がある（ホーム画面のアイコンを削除して追加し直す、
   Safari の「Webサイトデータを消去」、端末の入れ替え）。
   そのための持ち出し口が settings の export / import。 */
var KEY='murmur_state_v1';
var SNAP='murmur_snap_';
var IDB_NAME='vein',IDB_STORE='state';

function blank(){return {version:1,entries:[],settings:{}}}
var mem={},volatile=false,warned=false;
var store={
  get:function(k){try{return localStorage.getItem(k)}catch(e){volatile=true;return k in mem?mem[k]:null}},
  set:function(k,v){try{localStorage.setItem(k,v)}catch(e){volatile=true;mem[k]=v}},
  del:function(k){try{localStorage.removeItem(k)}catch(e){delete mem[k]}},
  keys:function(){
    var out=[];
    try{for(var i=0;i<localStorage.length;i++)out.push(localStorage.key(i))}catch(e){out=Object.keys(mem)}
    return out;
  }
};

/* 形を整える。壊れた1件で全部を落とさない */
function fix(s){
  if(!s||typeof s!=='object'||!Array.isArray(s.entries))return null;
  s.version=1;
  s.settings=s.settings&&typeof s.settings==='object'?s.settings:{};
  delete s.settings.key;          /* 鍵の概念をやめたので、残っていても捨てる */
  s.settings.seen=Array.isArray(s.settings.seen)?s.settings.seen:[];
  s.settings.prev=Array.isArray(s.settings.prev)?s.settings.prev:[];
  s.entries=s.entries.filter(function(e){return e&&typeof e==='object'&&(e.raw||e.digest)});
  s.entries.forEach(function(e){
    e.id=String(e.id||('m'+Math.random().toString(36).slice(2,10)));
    e.raw=String(e.raw||'');
    e.lines=Array.isArray(e.lines)?e.lines:[];
    e.digest=String(e.digest||'');
    e.tags=Array.isArray(e.tags)?e.tags:[];
    e.picks=Array.isArray(e.picks)?e.picks:[];
    e.asks=Array.isArray(e.asks)?e.asks:[];
    e.notes=Array.isArray(e.notes)?e.notes:[];
    e.ask=String(e.ask||'');
    e.seed=String(e.seed||'');
    e.createdAt=String(e.createdAt||nowIso());
    e.status=e.status||'draft';           /* draft → read → kept */
    e.day=e.day||(e.createdAt||'').slice(0,10)||today();
  });
  return s;
}
function parse(raw){
  if(!raw)return null;
  try{return fix(JSON.parse(raw))}catch(e){return null}
}
/* 足し合わせる。同じ id は、先へ進んでいるほう（kept > read > draft）を残す */
var RANK={draft:0,read:1,kept:2};
function merge(a,b){
  if(!a)return b;if(!b)return a;
  var by={},order=[];
  function put(e){
    var o=by[e.id];
    if(!o){by[e.id]=e;order.push(e.id);return}
    var ra=RANK[o.status]||0,rb=RANK[e.status]||0;
    if(rb>ra||(rb===ra&&(e.lines.length>o.lines.length||e.raw.length>o.raw.length)))by[e.id]=e;
  }
  a.entries.forEach(put);b.entries.forEach(put);
  var out=blank();
  out.entries=order.map(function(id){return by[id]})
    .sort(function(x,y){return x.createdAt<y.createdAt?-1:1});
  var sa=a.settings||{},sb=b.settings||{};
  var seen={};
  (sa.seen||[]).concat(sb.seen||[]).forEach(function(q){seen[q]=1});
  out.settings.seen=Object.keys(seen);
  out.settings.prev=(sa.prev&&sa.prev.length?sa.prev:sb.prev)||[];
  out.settings.persisted=sa.persisted||sb.persisted||false;
  return out;
}

/* ── IndexedDB（控え） ── */
function idb(fn){
  return new Promise(function(res,rej){
    var r;
    try{r=indexedDB.open(IDB_NAME,1)}catch(e){return rej(e)}
    r.onupgradeneeded=function(){try{r.result.createObjectStore(IDB_STORE)}catch(e){}};
    r.onerror=function(){rej(r.error)};
    r.onsuccess=function(){
      try{fn(r.result,res,rej)}catch(e){rej(e)}
    };
  });
}
function idbGet(){
  return idb(function(db,res,rej){
    var q=db.transaction(IDB_STORE,'readonly').objectStore(IDB_STORE).get('state');
    q.onsuccess=function(){res(q.result||null)};
    q.onerror=function(){rej(q.error)};
  });
}
function idbPut(v){
  return idb(function(db,res,rej){
    var q=db.transaction(IDB_STORE,'readwrite').objectStore(IDB_STORE).put(v,'state');
    q.onsuccess=function(){res(true)};
    q.onerror=function(){rej(q.error)};
  });
}

/* ── 立ち上げ：localStorage と、日ごとの控えを足し合わせる ── */
var recovered=0;            /* 立ち上げで控えから戻した件数 */
var state=(function load(){
  var main=parse(store.get(KEY));
  var raw=store.get(KEY);
  if(raw&&!main){                                   /* 読めなかったぶんは捨てずに退避 */
    store.set(KEY+'_backup_'+Date.now(),raw);
    setTimeout(function(){say('うまく読めなかった。控えから戻す')},500);
  }
  var out=main;
  store.keys().forEach(function(k){
    if(k.indexOf(SNAP)!==0&&k.indexOf(KEY+'_backup_')!==0)return;
    var s2=parse(store.get(k));
    if(s2)out=merge(out,s2);
  });
  out=out||blank();
  recovered=out.entries.length-(main?main.entries.length:0);
  return out;
})();

/* ── 保存：本体・控え・日ごとの控え ── */
var snapDay=store.get('murmur_snap_day')||'';
function save(){
  var json=JSON.stringify(state);
  store.set(KEY,json);

  /* その日の控えを、保存のたびに上書きする（直近10日ぶん）。
     日が変わった瞬間だけ残していたころは、その日に書いたものが控えに入らなかった。 */
  var t=today();
  store.set(SNAP+t,json);
  if(snapDay!==t){
    snapDay=t;store.set('murmur_snap_day',t);
    var snaps=store.keys().filter(function(k){return k.indexOf(SNAP)===0&&k!=='murmur_snap_day'}).sort();
    while(snaps.length>10)store.del(snaps.shift());
  }

  try{idbPut(json)['catch'](function(){})}catch(e){}

  if(volatile&&!warned){warned=true;setTimeout(function(){say('この画面ではデータが残らない。ホーム画面に追加して使って。')},600)}
}

/* 控えから戻したものは、その場で本体へ書き戻す。
   memory の中だけで戻しても、次に開いたときにまた同じことをするので。 */
if(recovered>0){
  save();
  setTimeout(function(){say('控えから '+recovered+'件を戻した')},700);
}

/* ── 立ち上げのあと：IndexedDB の控えと突き合わせる ── */
function syncIdb(){
  idbGet().then(function(raw){
    var s2=parse(raw);
    if(!s2)return idbPut(JSON.stringify(state));
    var before=state.entries.length;
    var m=merge(state,s2);
    if(m.entries.length>before){
      state=m;save();draw();
      say('控えから '+(m.entries.length-before)+'件を戻した');
    }else if(s2.entries.length<state.entries.length){
      idbPut(JSON.stringify(state));
    }
  })['catch'](function(){});
}

/* ── 端末に「消さないで」と頼む（iOS/Chrome とも、断られても動きは変わらない） ── */
function askPersist(){
  try{
    if(!navigator.storage||!navigator.storage.persist)return;
    navigator.storage.persisted().then(function(ok){
      if(ok){state.settings.persisted=true;return}
      navigator.storage.persist().then(function(got){
        state.settings.persisted=!!got;
      })['catch'](function(){});
    })['catch'](function(){});
  }catch(e){}
}

function find(id){for(var i=0;i<state.entries.length;i++)if(state.entries[i].id===id)return state.entries[i];return null}

/* ───────── 通知 ───────── */
var toast=$('toast'),toastMsg=$('toastMsg'),toastAct=$('toastAct'),toastT=null;
function say(msg,label,fn){
  toastMsg.textContent=msg;
  if(label){toastAct.hidden=false;toastAct.textContent=label;toastAct.onclick=function(){hideToast();fn()}}
  else{toastAct.hidden=true;toastAct.onclick=null}
  toast.classList.add('on');
  clearTimeout(toastT);toastT=setTimeout(hideToast,label?6000:3000);
}
function hideToast(){toast.classList.remove('on')}

/* ───────── 面の移動 ───────── */
var track=$('track'),dots=$('dots').children,pane=0;
function goPane(i,smooth){track.scrollTo({left:track.clientWidth*i,behavior:smooth===false?'auto':'smooth'})}
track.addEventListener('scroll',function(){
  var w=track.clientWidth||1,i=Math.round(track.scrollLeft/w);
  i=Math.max(0,Math.min(1,i));
  if(i===pane)return;
  pane=i;
  for(var k=0;k<2;k++)dots[k].classList.toggle('on',k===pane);
  if(pane===0)start();else stop();
},{passive:true});
window.addEventListener('resize',function(){measure();goPane(pane,false)});

/* ───────── 語の野 ─────────
   日記の入り口になる概念を、丸のまわりに回しておく。語は触らない（触るのは丸だけ）。

   3つのことが同時に起きている:
   1. 語は円軌道をゆっくり回る。半径・速さ・向き・揺れは語ごとに違う
   2. ときどき1語が消えて、置いていない語に入れ替わる（同じ12語を見つづけない）
   3. 下（問いのすぐ上）を通る語が focus になり、問いがひとりでに書き替わる

   ◯ を押した瞬間の focus が、その日記の入口（seed）として残る。 */
var WORDS=[
  {w:'do',     q:'今日、実際に何をした？'},
  {w:'be',     q:'今日、どんな状態でいた？'},
  {w:'have',   q:'いま何を持っていて、何が足りない？'},
  {w:'feel',   q:'気持ちがいちばん動いたのは、いつ？'},
  {w:'meet',   q:'誰と会って、何が残った？'},
  {w:'want',   q:'ほんとうに欲しいのは、なに？'},
  {w:'lose',   q:'今日、手放したもの・失ったものは？'},
  {w:'learn',  q:'知らなかった、と気づいたことは？'},
  {w:'give',   q:'誰に、何を渡した？'},
  {w:'stuck',  q:'どこで詰まった？なぜ動かない？'},
  {w:'why',    q:'なぜ、それをやっている？'},
  {w:'next',   q:'明日いちばん先に手をつけるのは？'},
  {w:'notice', q:'誰も言っていないけれど、見えたことは？'},
  {w:'change', q:'半年前と、何が変わった？'},
  {w:'money',  q:'今日、お金はどこへ流れていた？'},
  {w:'body',   q:'体はなんと言っている？'},
  {w:'time',   q:'いちばん長く使った時間は、何に？'},
  {w:'people', q:'世の中の人は、いま何を欲しがっている？'},
  {w:'work',   q:'その仕事は、誰の何を動かした？'},
  {w:'rule',   q:'当たり前だと思って従っている決まりは？'},
  {w:'doubt',  q:'ほんとうかな、と思ったのはどれ？'},
  {w:'build',  q:'いま何を作っている？なぜそれを？'},
  {w:'fail',   q:'うまくいかなかったのは、どこから？'},
  {w:'trust',  q:'誰を信じている？誰を疑っている？'},
  {w:'city',   q:'街で目についたものは？'},
  {w:'read',   q:'読んだ・聞いたもので残ったのは？'},
  {w:'price',  q:'それの値段は、何で決まっている？'},
  {w:'quiet',  q:'静かなときに浮かんでくるのは？'},
  {w:'anger',  q:'何に腹が立った？その下には何がある？'},
  {w:'hope',   q:'そうなったらいい、と思うのは？'},
  {w:'edge',   q:'いま、何の分かれ目にいる？'},
  {w:'waste',  q:'無駄だったと思うのは、ほんとうに無駄？'}
];

/* 見えている語の数と、それぞれの道。
   同心円にすると輪の間隔が狭いところで数珠つなぎになり、
   楕円を傾けると縦長の道が横幅に潰されて真ん中へ寄ってしまう。
   ここでは「縦横の伸びが語ごとに違う楕円 ＋ ゆっくり流れる中心」でばらけさせている。 */
var SLOTS=[
  {rx:.08,ry:.34,sp: .000130},
  {rx:.92,ry:.10,sp:-.000101},
  {rx:.34,ry:.76,sp: .000086},
  {rx:.66,ry:.52,sp:-.000119},
  {rx:.14,ry:.96,sp: .000071},
  {rx:.78,ry:.30,sp:-.000094},
  {rx:.48,ry:.66,sp:-.000112},
  {rx:1.0,ry:.46,sp: .000079},
  {rx:.26,ry:.56,sp:-.000068},
  {rx:.58,ry:.88,sp: .000106},
  {rx:.86,ry:.72,sp: .000092}
];
var SWAP_MS=6800;           /* 何ミリ秒ごとに1語を入れ替えるか */

var field=$('field'),speak=$('speak'),said=$('said'),askEl=$('ask'),orb=null,seed='',pendingAsk='';
var live=[],RX=0,RY=0,focusI=-1,askShown='',raf=null,lastT=0,beat=null,swapping=false;
var blobPath=null;

/* ───────── 真ん中のアメーバ ─────────
   円ではなく、9点の半径がそれぞれ違う周期で伸び縮みする閉じた曲線。
   点を Catmull-Rom で結んでベジェにするので、角が出ない。
   平らな1色のまま、輪郭だけが動く。 */
var BN=9,BR=33;
function blobD(t){
  var p=[],i;
  for(i=0;i<BN;i++){
    var a=i/BN*Math.PI*2;
    var r=BR*(1
      +0.090*Math.sin(t*0.00062+i*1.7)
      +0.055*Math.sin(t*0.00041+i*2.9)
      +0.030*Math.sin(t*0.00097+i*0.8));
    p.push([50+Math.cos(a)*r,50+Math.sin(a)*r]);
  }
  var d='M'+p[0][0].toFixed(2)+' '+p[0][1].toFixed(2);
  for(i=0;i<BN;i++){
    var p0=p[(i-1+BN)%BN],p1=p[i],p2=p[(i+1)%BN],p3=p[(i+2)%BN];
    d+='C'+(p1[0]+(p2[0]-p0[0])/6).toFixed(2)+' '+(p1[1]+(p2[1]-p0[1])/6).toFixed(2)
      +','+(p2[0]-(p3[0]-p1[0])/6).toFixed(2)+' '+(p2[1]-(p3[1]-p1[1])/6).toFixed(2)
      +','+p2[0].toFixed(2)+' '+p2[1].toFixed(2);
  }
  return d+'Z';
}

function measure(){
  var w=field.clientWidth||window.innerWidth,h=field.clientHeight||window.innerHeight;
  /* 横は字の箱がはみ出さないところまで、縦は面をだいたい使いきるところまで */
  RX=Math.max(80,Math.min(w*0.40,w/2-38));
  RY=Math.max(120,h*0.43);
  for(var i=0;i<live.length;i++){
    var l=live[i];
    l.rx=72+l.rxf*(RX-72);
    l.ry=120+l.ryf*(RY-120);
  }
}
function freeWord(){
  var used={};live.forEach(function(l){used[l.wi]=1});
  var pool=[];
  for(var i=0;i<WORDS.length;i++)if(!used[i])pool.push(i);
  if(!pool.length)return Math.floor(Math.random()*WORDS.length);
  return pool[Math.floor(Math.random()*pool.length)];
}
function place(){
  field.innerHTML='';live=[];focusI=-1;
  SLOTS.forEach(function(sl,i){
    var el=document.createElement('button');
    el.className='word';
    var inner=document.createElement('i');
    el.appendChild(inner);
    (function(idx){
      el.addEventListener('click',function(ev){
        ev.stopPropagation();
        select(live[idx]===undefined?-1:idx);
      });
    })(i);
    field.appendChild(el);
    var l={el:el,inner:inner,wi:-1,rxf:sl.rx,ryf:sl.ry,sp:sl.sp,rx:0,ry:0,
           a:(i/SLOTS.length)*Math.PI*2+Math.random()*.4,born:performance.now()+i*90,
           p1:Math.random()*6.28,p2:Math.random()*6.28};
    l.wi=freeWord();
    live.push(l);
    inner.textContent=WORDS[l.wi].w;
  });

  var wrap=document.createElement('div');
  wrap.className='orbwrap';
  orb=document.createElement('button');
  orb.className='orb';orb.setAttribute('aria-label','押して、今日を声に出す');
  orb.innerHTML='<svg viewBox="0 0 100 100" aria-hidden="true"><path d=""></path></svg>';
  blobPath=orb.querySelector('path');
  orb.addEventListener('pointerdown',function(){orb.classList.add('press')});
  ['pointerup','pointercancel','pointerleave'].forEach(function(ev){
    orb.addEventListener(ev,function(){orb.classList.remove('press')});
  });
  orb.addEventListener('click',openInput);
  wrap.appendChild(orb);
  field.appendChild(wrap);

  measure();
  if(blobPath)blobPath.setAttribute('d',blobD(performance.now()));
  draw2(performance.now());
  /* 立ち上げでは何も選ばない。問いは、語を押したときだけ出る */
  if(!reduced)start();
}

function setAsk(q){
  if(q===askShown)return;
  var first=!askShown;
  askShown=q;
  if(!q){askEl.classList.remove('on');return}      /* 選んでいないときは何も出さない */
  if(first){askEl.textContent=q;askEl.classList.add('on');return}
  askEl.classList.remove('on');
  setTimeout(function(){
    if(askShown!==q)return;
    askEl.textContent=q;askEl.classList.add('on');
  },260);
}
/* 語を選ぶ。押した語だけが濃くなり、その問いが下に出る。
   もう一度押すと外れて、問いも消える。勝手には動かない。 */
function select(i){
  if(i===focusI){                       /* 同じ語をもう一度 → 外す */
    live[focusI].el.classList.remove('on');
    focusI=-1;setAsk('');
    return;
  }
  if(focusI>=0&&live[focusI])live[focusI].el.classList.remove('on');
  focusI=i;
  if(i<0){setAsk('');return}
  live[i].el.classList.add('on');
  setAsk(WORDS[live[i].wi].q);
}

/* 速さが違うので、放っておくと語同士が重なって読めなくなる。
   半径の近いものが角度で近づいたときだけ、そっと押し合う。 */
function spread(dt){
  for(var i=0;i<live.length;i++)for(var j=i+1;j<live.length;j++){
    var a=live[i],b=live[j];
    if(a.x===undefined||b.x===undefined)continue;
    var dx=Math.abs(a.x-b.x),dy=Math.abs(a.y-b.y);
    if(dy>40||dx>100)continue;                       /* 字の箱ぶん */
    /* 近いほど強く。急に飛ばないよう、遠いところでは効かせない */
    var f=(1-dx/100)*(1-dy/40);

    l.inner.textContent=WORDS[l.wi].w;
    l.a=openAngle(l);
    l.ph=Math.random()*6.28;

  for(var i=0;i<out.length;i++){
    var win=rk.concat(out.slice(Math.max(0,i-6),i).map(function(d){return d.k})).slice(-6);
    if(win.indexOf(out[i].k)<0)continue;
    var hit=-1;
    /* 直したいからといって、さっき出した問いを前へ持ってこない */
    for(var j=i+1;j<tail;j++)if(win.indexOf(out[j].k)<0){hit=j;break}
    if(hit<0)for(var j2=Math.max(i+1,tail);j2<out.length;j2++)if(win.indexOf(out[j2].k)<0){hit=j2;break}
    if(hit>=0){var t=out[i];out[i]=out[hit];out[hit]=t}
  }
  deck=out;deckI=0;
}
function nextDeep(){
  if(deckI>=deck.length)buildDeck();
  var d=deck[deckI++];
  recentQ.push(qid(d));while(recentQ.length>24)recentQ.shift();
  recentK.unshift(d.k);while(recentK.length>6)recentK.pop();
  var pr=PRAC[d.k]||{s:'',n:''};
  deepAsk=d.q;
  $('dLabel').textContent=d.k;
  $('dQ').textContent=d.q;
  $('dNote').textContent=pr.n;
  $('dSrc').textContent=pr.s;
  var seen=state.settings.seen||(state.settings.seen=[]);
  if(seen.indexOf(qid(d))<0){seen.push(qid(d));save()}
  var c=$('dcard');c.classList.remove('in');void c.offsetWidth;c.classList.add('in');
}
function openDeep(){

}
function closeDeep(){

/* 縦になぞったときだけ拾う。横は面の移動に残す */
var ty=0,tx=0,swiping=false;
speak.addEventListener('touchstart',function(e){

     取りこぼすと「反応しない」に見えるので、しきいは低め（44px）にしてある。 */

/* ───────── 喋ったものを組み立てる ─────────
   ここは記録に徹する。AIは呼ばないし、解釈もしない。
   やるのは2つだけ。

   1. 日本語として読める行に割る（言いよどみと短い言い直しを落とす）＝ origin
   2. その行を語で寄せて、かたまりごとに要点だけ残す           ＝ summary

   洞察・問い・過去との突き合わせは置かない（規則では作れないものを作らない）。 */

/* 言いよどみ。喋りの頭に必ず付くものだけを落とす */
var FILL=/^(えーと|えっと|えー|あのー|あの|うーん|んー|なんか|そうだな|やっぱり|ていうか|というか|まあ)[、,。\s]*/;
/* 「で」「あと」などは語の頭にもなる（でも・まだ・あとで）。
   読点や空きが続くときだけ、つなぎ言葉として落とす。 */
var FILL2=/^(で|ま|あと|それで|そして|んで)[、,\s]+/;
/* 言い方の重み。要点を選ぶときに、ここを含む行を上げる */
var MARK=/気づ|気付|わかった|分かった|つまり|結局|そうか|実は|逆に|重要|大事|ということは|だと思う|べき|やめ|決め|したい|しよう|必要|問題は|大事なのは/;

/* ① ほぼ言ったまま、日本語だけ直した行 */
function sentences(raw){
  var parts=String(raw).replace(/\r/g,'').split(/[。\n]+|(?<=[！？!?])/);
  var out=[];
  parts.forEach(function(p){
    var t=p.replace(/\s+/g,' ').trim();
    for(var i=0;i<3;i++)t=t.replace(FILL,'').replace(FILL2,'');
    t=t.trim();
    if(!t)return;
    /* 短い言い直しは前の行にくっつける（1行1事にするため） */
    if(t.length<7&&out.length){out[out.length-1]=out[out.length-1].replace(/。$/,'')+'、'+t+'。';return}
    if(!/[。！？!?、]$/.test(t))t+='。';
    if(out.indexOf(t)<0)out.push(t);
  });
  return out;
}

/* 語を拾う。辞書は積まない（漢字・カタカナ・英数の連なりを語とみなす） */
var STOPW=('これ それ あれ ここ そこ 自分 感じ 今日 明日 昨日 本当 全部 一番 結局 場合 状態 部分 感じで '+
           'あと いま すごい ちょっと やっぱり みたいな という ため よう こと もの とき 話 人 的な').split(' ');
function wordsOf(t){
  var re=/[々〆一-鿿ァ-ヿｦ-ﾟA-Za-z]{2,10}/g,m,out=[];
  while((m=re.exec(String(t)))!==null)if(STOPW.indexOf(m[0])<0)out.push(m[0]);
  return out;
}
function tagsLocal(lines){
  var c={};
  wordsOf(lines.join(' ')).forEach(function(w){c[w]=(c[w]||0)+w.length});
  return Object.keys(c).sort(function(a,b){return c[b]-c[a]||b.length-a.length}).slice(0,2);
}

/* ② 語で寄せて、かたまりにする。
   話は行き来するので、同じ語が出てくる行を1つに束ねると切り替わりが見える。 */
function groupsOf(e){
  var ls=e.lines&&e.lines.length?e.lines:sentences(e.raw);
  if(ls.length<4)return [{h:'',ls:ls,all:ls}];
  var gs=[];
  ls.forEach(function(l){
    var ws=wordsOf(l),best=null,bs=0;
    gs.forEach(function(g){
      var sc=0;
      ws.forEach(function(w){if(g.w[w])sc+=w.length});
      if(sc>bs){bs=sc;best=g}
    });
    if(best&&bs>=2){
      best.all.push(l);
      ws.forEach(function(w){best.w[w]=(best.w[w]||0)+1});
    }else{
      var g={all:[l],w:{}};
      ws.forEach(function(w){g.w[w]=1});
      gs.push(g);
    }
  });
  /* 多すぎると見出しばかりになるので、小さいかたまりは後ろから畳む */
  while(gs.length>4){
    var mi=1,ms=1e9;
    for(var i=1;i<gs.length;i++)if(gs[i].all.length<=ms){ms=gs[i].all.length;mi=i}
    var g2=gs.splice(mi,1)[0],t=gs[mi-1];
    g2.all.forEach(function(x){t.all.push(x)});
    Object.keys(g2.w).forEach(function(w){t.w[w]=(t.w[w]||0)+g2.w[w]});
  }
  /* 見出しは、そのかたまりで2回以上・3字以上出てくる語があるときだけ。
     1回だけの語を見出しにすると「行抜」のような切れ端が出て、かえって読めない。 */
  gs.forEach(function(g){
    var best='',bs=0;
    Object.keys(g.w).forEach(function(w){
      if(g.w[w]<2||w.length<3)return;
      var sc=g.w[w]*w.length;
      if(sc>bs){bs=sc;best=w}
    });
    g.h=(g.all.length>1&&gs.length>1)?best:'';
    /* かたまりの中は、言い方の重みと長さで要点だけ残す（話した順は変えない） */
    var keep=Math.max(1,Math.round(6/gs.length));
    if(g.all.length<=keep){g.ls=g.all.slice();return}
    var sc2=g.all.map(function(l,i){return {l:l,i:i,s:(MARK.test(l)?100:0)+Math.min(l.length,60)}});
    sc2.sort(function(x,y){return y.s-x.s});
    g.ls=sc2.slice(0,keep).sort(function(x,y){return x.i-y.i}).map(function(x){return x.l});
  });
  return gs;
}
function bulletsOf(e){
  var out=[];
  groupsOf(e).forEach(function(g){g.ls.forEach(function(l){out.push(l)})});
  return out;
}

/* 置いた直後に組み立てる。待ち時間は無い（外へ出ないので） */
function shape(e){
  e.lines=sentences(e.raw);
  if(!e.lines.length)e.lines=[String(e.raw).trim()];
  e.tags=tagsLocal(e.lines);
  e.digest=bulletsOf(e).slice(0,2).join(' ');
  save();draw();
}

/* ───────── 記録の面 ───────── */
var filter='';
function kept(){return state.entries.filter(function(e){return e.status==='kept'})}
function tagCount(){
  var c={};
  kept().forEach(function(e){e.tags.forEach(function(t){c[t]=(c[t]||0)+1})});
  return c;
}
function streak(){
  var days={};state.entries.forEach(function(e){days[e.day]=1});
  var d=new Date(),n=0;
  if(!days[ymd(d)]){d.setDate(d.getDate()-1);if(!days[ymd(d)])return 0}
  while(days[ymd(d)]){n++;d.setDate(d.getDate()-1)}
  return n;
}
function draw(){
  var days={};state.entries.forEach(function(e){days[e.day]=1});
  var tc=tagCount(),tags=Object.keys(tc);
  $('cDays').textContent=Object.keys(days).length;
  $('cRow').textContent=streak();
  $('cTag').textContent=tags.length;

  var cloud=$('cloud');cloud.innerHTML='';
  tags.sort(function(a,b){return tc[b]-tc[a]||(a<b?-1:1)}).slice(0,14).forEach(function(t){
    var b=document.createElement('button');
    b.className='tag'+(tc[t]>=3?' big':tc[t]===2?' mid':'')+(filter===t?' on':'');
    b.innerHTML='#'+esc(t)+(tc[t]>1?'<em>'+tc[t]+'</em>':'');
    b.addEventListener('click',function(){filter=filter===t?'':t;draw()});
    cloud.appendChild(b);
  });

  var list=$('list');list.innerHTML='';
  var rows=state.entries.filter(function(e){return !filter||e.tags.indexOf(filter)>=0});
  if(!rows.length){
    var p=document.createElement('div');p.className='empty';
    p.textContent=filter?'この見出しはまだ無い':(state.entries.length?'':'◯ を押して、今日を喋る');
    list.appendChild(p);
    $('axis').style.visibility='hidden';
    return;
  }
  $('axis').style.visibility='';

  var byDay={};
  rows.forEach(function(e){(byDay[e.day]=byDay[e.day]||[]).push(e)});
  var have=Object.keys(byDay).sort();
  var oldest=have[0],cur=today(),gap=0,guard=0;
  /* 書いた日だけを詰めて出すと、間が空いたことが見えない。
     空いた日はまとめて1行にして、続いているかどうかが分かるようにする。 */
  var mon='';
  if(!filter&&!byDay[cur]){
    mon=cur.slice(0,7);
    list.appendChild(monRow(mon));
    list.appendChild(dayRow(cur,[]));
    cur=prevDay(cur);
  }
  while(cur>=oldest&&guard++<500){
    if(byDay[cur]){
      if(gap){list.appendChild(gapRow(gap));gap=0}
      var m=cur.slice(0,7);
      if(m!==mon){mon=m;list.appendChild(monRow(m))}   /* 月の区切り＝長くなったときの背骨 */
      list.appendChild(dayRow(cur,byDay[cur]));
    }else gap++;
    cur=prevDay(cur);
  }
  if(gap)list.appendChild(gapRow(gap));
}
function prevDay(iso){
  var p=iso.split('-'),d=new Date(+p[0],+p[1]-1,+p[2]);
  d.setDate(d.getDate()-1);
  return ymd(d);
}
function minutes(iso){
  var m=/T(\d\d):(\d\d)/.exec(iso||'');
  return m?(+m[1])*60+(+m[2]):12*60;
}
function monRow(m){
  var p=m.split('-'),d=document.createElement('div');
  d.className='mon';
  d.innerHTML='<b>'+(+p[0])+'年'+(+p[1])+'月</b><hr>';
  return d;
}
function gapRow(n){
  var g=document.createElement('div');g.className='gap';
  g.innerHTML='<hr><span>'+n+'日</span><hr>';
  return g;
}
function dayRow(day,list){
  var es=list.slice().sort(function(a,b){return minutes(a.createdAt)-minutes(b.createdAt)});
  var wrap=document.createElement('div');wrap.className='dayrow';

  var h=document.createElement('div');h.className='dh';
  var p=day.split('-'),lab=dayLabel(day);
  var sub=/^\d/.test(lab)?'':((+p[1])+'/'+(+p[2]));   /* 今日・昨日だけ、日付を添える */
  h.innerHTML='<b>'+esc(lab)+'</b>'+(sub?'<span>'+sub+'</span>':'')+
              (es.length>1?'<em>'+es.length+'</em>':'');
  wrap.appendChild(h);

  var tr=document.createElement('div');tr.className='tr'+(day===today()?' now':'');
  [6,12,18].forEach(function(hh){
    var t=document.createElement('i');t.className='tick';t.style.left=(hh/24*100)+'%';
    tr.appendChild(t);
  });
  /* 同じころに書いたものが重なって1点に見えないよう、近いものは上下に散らす */
  var lastX=-99,step=0;
  es.forEach(function(e){
    var x=minutes(e.createdAt)/1440*100;
    x=Math.max(2.5,Math.min(97.5,x));
    if(x-lastX<5)step=step>0?-1:(step<0?2:1);else step=0;
    lastX=x;
    var b=document.createElement('button');
    b.className='pt'+(e.status==='kept'?' kept':'')+
               (filter&&e.tags.indexOf(filter)>=0?' hit':'');
    b.style.left=x+'%';
    b.style.marginTop=(-5.5+step*8)+'px';
    b.setAttribute('aria-label',hhmm(e.createdAt)+'　'+(e.digest||e.raw).slice(0,24));
    b.addEventListener('click',function(){openSheet(e)});
    tr.appendChild(b);
  });
  wrap.appendChild(tr);

  if(!es.length){
    var q=document.createElement('div');q.className='yet';
    q.textContent='まだ';
    wrap.appendChild(q);
    return wrap;
  }

  var items=document.createElement('div');items.className='items';
  es.forEach(function(e){
    var it=document.createElement('button');it.className='it';
    var tg=e.tags.length?'<div class="tg">'+e.tags.map(function(t){return '<s>'+esc(t)+'</s>'}).join('')+'</div>':'';
    var st=e.status==='draft'?'<span class="st">まだ読んでいない</span>':
           (e.status==='read'?'<span class="st">まだ保存していない</span>':'');
    var qa=e.ask?'<span class="qa">'+esc(e.ask)+'</span>':'';
    it.innerHTML='<u>'+hhmm(e.createdAt)+'</u><div>'+qa+'<p>'+esc(e.digest||e.raw)+'</p>'+tg+st+'</div>';
    it.addEventListener('click',function(){openSheet(e)});
    items.appendChild(it);
  });
  wrap.appendChild(items);
  return wrap;
}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}

/* ───────── 文字にして写す ─────────
   日記はこの端末の中にしか無いので、外へ出す道をひとつだけ持たせる。
   ▢ を押すと、全部が読める文になってクリップボードへ入る。 */
function entryText(e){
  var L=['## '+e.day+' '+hhmm(e.createdAt)+(e.seed?'  ['+e.seed+']':'')];
  if(e.tags.length)L.push(e.tags.map(function(t){return '#'+t}).join(' '));
  if(e.ask)L.push('問い: '+e.ask);
  L.push('');
  L.push('― 要点');
  groupsOf(e).forEach(function(g){
    if(g.h)L.push('【'+g.h+'】');
    g.ls.forEach(function(l){L.push('- '+l)});
  });
  L.push('');
  if(e.lines.length){L.push('― 話したこと');e.lines.forEach(function(l){L.push('- '+l)});L.push('')}
  /* 旧版（Claudeを呼んでいたころ）の洞察が残っているものは、写しにだけ残す */
  if(e.picks&&e.picks.length){
    L.push('― 洞察（旧版）');
    e.picks.forEach(function(x){L.push('- '+x.t+(x.d?'　'+x.d:''))});
    L.push('');
  }
  if(e.raw){L.push('― 喋ったまま');L.push(e.raw);L.push('')}
  return L.join('\n');
}
function allText(){
  var es=state.entries.slice().sort(function(a,b){return a.createdAt<b.createdAt?1:-1});
  var L=['# journaling　'+today()+' 時点', '', es.length+'件 / '+Object.keys(es.reduce(function(o,e){o[e.day]=1;return o},{})).length+'日', ''];
  es.forEach(function(e){L.push(entryText(e))});
  return L.join('\n');
}
/* クリップボードは https か localhost でしか使えない。
   使えないときは、選択して写す昔の道に落とす。 */
function copy(text,btn){
  function done(){
    if(btn){btn.classList.add('done');setTimeout(function(){btn.classList.remove('done')},900)}
    say('copied');
  }
  function fallback(){
    try{
      var ta=document.createElement('textarea');
      ta.value=text;ta.setAttribute('readonly','');
      ta.style.position='fixed';ta.style.top='-1000px';ta.style.opacity='0';
      document.body.appendChild(ta);
      ta.select();ta.setSelectionRange(0,text.length);
      var ok=document.execCommand('copy');
      ta.remove();
      ok?done():say('写せなかった');
    }catch(e){say('写せなかった')}
  }
  if(navigator.clipboard&&navigator.clipboard.writeText)
    navigator.clipboard.writeText(text).then(done,fallback);
  else fallback();
}

/* ───────── 設定の面 ─────────
   鍵は日記の並びの中には置かない（毎日見るものではないので、目的が読めなくなる）。 */
var setSheet=$('set');
function openSet(){
  drawSet();
  setSheet.classList.add('on');setSheet.setAttribute('aria-hidden','false');
  track.classList.add('lock');
}
function closeSet(){
  setSheet.classList.remove('on');setSheet.setAttribute('aria-hidden','true');
  track.classList.remove('lock');
}
$('setClose').addEventListener('click',closeSet);
$('openSet').addEventListener('click',openSet);
$('copyAll').addEventListener('click',function(){
  if(!state.entries.length){say('まだ1件も無い');return}
  copy(allText(),this);
});

function drawSet(){
  var b=$('setBody');b.className='body set';b.innerHTML='';

  var c=document.createElement('div');c.className='blk';
  c.innerHTML='<h3 class="lo">copy</h3>';
  var cb=document.createElement('button');
  cb.className='wide';cb.textContent='日記を全部うつす（'+state.entries.length+'件）';
  cb.addEventListener('click',function(){
    if(!state.entries.length){say('まだ1件も無い');return}
    copy(allText());
  });
  c.appendChild(cb);
  var cp=document.createElement('p');
  cp.textContent='要点・話したこと・喋ったままの全部が、そのまま読める形でクリップボードに入る。1件ずつ・1段ずつは、それぞれの右上の ▢ から。';
  c.appendChild(cp);
  b.appendChild(c);

  var d=document.createElement('div');d.className='blk';
  d.innerHTML='<h3 class="lo">data</h3>';
  var info=document.createElement('p');
  var snaps=store.keys().filter(function(k){return k.indexOf(SNAP)===0}).length;
  info.innerHTML='いま <b>'+state.entries.length+'件</b>。'+
    '同じものを3か所に置いている（すぐ読む場所・端末の中の控え・日ごとの控え '+snaps+'日ぶん）。'+
    '開くたびに全部を足し合わせるので、どれか1つ消えても戻る。'+
    (state.settings.persisted?'この端末では「消さない」扱いになっている。':'')+
    '<br><br>ただし<b>ホーム画面のアイコンを消して入れ直すと、置き場所ごと消える</b>。'+
    'Safari で開いたときと、ホーム画面から開いたときで、別の置き場所になることもある。'+
    '移すときは、下の export と import を使う。';
  d.appendChild(info);
  b.appendChild(d);

  var f=document.createElement('div');f.className='blk';
  f.innerHTML='<h3 class="lo">restore</h3>';
  var fb=document.createElement('button');
  fb.className='wide';fb.textContent='この端末の中を探して戻す';
  var fp=document.createElement('p');
  fp.textContent='この端末のこのアプリの中にある控えを全部読み直して、足りない日記があれば戻す。0件と出たら、日記はこの入れ物には無い（別のアイコン、または Safari 側にある）。';
  fb.addEventListener('click',function(){
    var found=[],before=state.entries.length;
    store.keys().forEach(function(k){
      if(k!==KEY&&k.indexOf(SNAP)!==0&&k.indexOf(KEY+'_backup_')!==0)return;
      var s2=parse(store.get(k));
      if(s2&&s2.entries.length){found.push(k+'（'+s2.entries.length+'件）');state=merge(state,s2)}
    });
    idbGet().then(function(raw){
      var s3=parse(raw);
      if(s3&&s3.entries.length){found.push('端末の中の控え（'+s3.entries.length+'件）');state=merge(state,s3)}
    })['catch'](function(){})['then'](function(){
      save();draw();
      var add=state.entries.length-before;
      fp.textContent=found.length?('見つかった控え: '+found.join('、')+'。'+(add?add+'件を戻した。':'足りないものは無かった。')):
        '見つかった控えは0件。日記はこの入れ物には無い。前のアイコンか Safari で開いて export し、ここに import で貼る。';
    });
  });
  f.appendChild(fb);f.appendChild(fp);
  b.appendChild(f);

  var x=document.createElement('div');x.className='blk';
  x.innerHTML='<h3 class="lo">export</h3>';
  var xb=document.createElement('button');
  xb.className='wide';xb.textContent='まるごと写す（あとで戻せる形）';
  xb.addEventListener('click',function(){
    copy(JSON.stringify(state));
    say('写した。メモ帳などに貼って残す');
  });
  x.appendChild(xb);
  var xp=document.createElement('p');
  xp.textContent='日記もタグも、出した問いも、まとめて1つの文字にする。端末を替える前と、ホーム画面に入れ直す前に、これを取っておく。';
  x.appendChild(xp);
  b.appendChild(x);

  var m=document.createElement('div');m.className='blk';
  m.innerHTML='<h3 class="lo">import</h3>';
  var ta=document.createElement('textarea');
  ta.className='paste';ta.setAttribute('placeholder','ここに貼る');
  ta.setAttribute('spellcheck','false');
  m.appendChild(ta);
  var mb=document.createElement('button');
  mb.className='wide';mb.textContent='足し合わせる';
  mb.addEventListener('click',function(){
    var v=(ta.value||'').trim();
    if(!v){say('貼ってから押して');return}
    var s2=parse(v);
    if(!s2){say('読めなかった。export で写したものを貼って');return}
    var before=state.entries.length;
    state=merge(state,s2);save();draw();drawSet();
    var add=state.entries.length-before;
    say(add?add+'件を足した':'新しいものは無かった');
  });
  m.appendChild(mb);
  var mp=document.createElement('p');
  mp.textContent='上書きはしない。足すだけ。同じ日記は進んでいるほうを残すので、何度貼っても増えない。';
  m.appendChild(mp);
  b.appendChild(m);
}

/* ───────── ひらく面 ─────────
   記録に徹する。上に構造化した要点、その下に話したことの全行、いちばん下に畳んだ raw。
   段ごとに ▢ で写せる。keep を押すと日記として並ぶ。 */
var sheet=$('sheet'),openId='';
function openSheet(e){
  openId=e.id;
  stop();
  if(e.status==='draft'){e.status='read';save();draw()}
  sheet.classList.add('on');sheet.setAttribute('aria-hidden','false');
  track.classList.add('lock');
  drawSheet(e);
}
function closeSheet(){
  openId='';
  if(pane===0)start();
  sheet.classList.remove('on');sheet.setAttribute('aria-hidden','true');
  track.classList.remove('lock');
}
$('sClose').addEventListener('click',closeSheet);
$('sCopy').addEventListener('click',function(){
  var e=find(openId);
  if(e)copy(entryText(e),this);
});

function drawSheet(e){
  if(!e||e.id!==openId)return;
  $('sWhen').textContent=dayLabel(e.day)+' '+hhmm(e.createdAt)+(e.seed?' · '+e.seed:'');
  var b=$('sBody');b.innerHTML='';

  /* ⓪ 深い問いから始めた日記は、その問いを頭に置く（何に答えたかも記録） */
  if(e.ask){
    var q=document.createElement('p');q.className='eask';
    q.textContent=e.ask;
    b.appendChild(q);
  }

  /* ① 構造化した要点。語で寄せたかたまりごとに置く */
  var gs=groupsOf(e);
  var sum=gs.map(function(g){
    return (g.h?'<h5 class="gh">'+esc(g.h)+'</h5>':'')+
      '<ul class="bul">'+g.ls.map(function(l){return '<li>'+esc(l)+'</li>'}).join('')+'</ul>';
  }).join('');
  b.appendChild(sec('summary',sum,function(){return blockText(e,'summary')}));

  if(e.tags.length){
    var t=document.createElement('div');t.className='cloud';t.style.margin='-6px 0 0';
    t.innerHTML=e.tags.map(function(x){return '<span class="tag">#'+esc(x)+'</span>'}).join('');
    b.appendChild(t);
  }

  /* ② ほぼ言ったまま、日本語だけ直した行。全部。
     短い日記だと①と同じ行になるので、そのときは出さない（同じものを二度読ませない） */
  var cut=0;
  gs.forEach(function(g){cut+=g.ls.length});
  if(cut<e.lines.length)b.appendChild(sec('origin',
    '<ul class="origin">'+e.lines.map(function(l){return '<li>'+esc(l)+'</li>'}).join('')+'</ul>',
    function(){return blockText(e,'origin')}));

  /* ③ 喋った文字そのまま。畳んで置く（読むためではなく、消さないための段） */
  b.appendChild(sec('raw','<p class="raw">'+esc(e.raw)+'</p>',
    function(){return e.raw},true));

  var foot=$('sFoot');foot.innerHTML='';
  if(e.status!=='kept'){
    var k=document.createElement('button');k.className='keep lo';k.textContent='keep';
    k.addEventListener('click',function(){
      e.status='kept';save();draw();closeSheet();
      say(e.tags.length?'#'+e.tags[0]+' で並べた':'並べた');
    });
    foot.appendChild(k);
  }
  var f2=document.createElement('button');f2.className='thin lo';f2.textContent='forget';
  f2.addEventListener('click',function(){
    say('この日記を消す？','yes',function(){
      var i=state.entries.indexOf(e);
      if(i>=0){var back=state.entries.splice(i,1)[0];save();draw();closeSheet();
        say('消した','undo',function(){state.entries.push(back);save();draw()})}
    });
  });
  foot.appendChild(f2);
}

/* 段ごとの文字。▢ で写すのはこれ */
function blockText(e,kind){
  var L=['## '+e.day+' '+hhmm(e.createdAt)+'　'+kind,''];
  if(kind==='summary'){
    if(e.tags.length)L.push(e.tags.map(function(t){return '#'+t}).join(' '));
    if(e.ask)L.push('問い: '+e.ask);
    L.push('');
    groupsOf(e).forEach(function(g){
      if(g.h)L.push('【'+g.h+'】');
      g.ls.forEach(function(l){L.push('- '+l)});
    });
  }else if(kind==='origin'){
    e.lines.forEach(function(l){L.push('- '+l)});
  }
  return L.join('\n')+'\n';
}

function sec(title,body,text,fold){
  var d=document.createElement('div');d.className='sec';
  var h=document.createElement('div');h.className='sh';
  var t=document.createElement(fold?'button':'div');
  t.className='shl';
  t.innerHTML='<h4 class="lo">'+title+'</h4>'+(fold?'<em>+</em>':'');
  h.appendChild(t);
  if(text){
    var c=document.createElement('button');
    c.className='ic sq';c.setAttribute('aria-label',title+' をうつす');
    c.innerHTML='<i></i>';
    c.addEventListener('click',function(){copy(text(),c)});
    h.appendChild(c);
  }
  d.appendChild(h);
  var w=document.createElement('div');
  if(typeof body==='string')w.innerHTML=body;else w.appendChild(body);
  if(fold){
    w.hidden=true;
    t.addEventListener('click',function(){
      w.hidden=!w.hidden;
      t.querySelector('em').textContent=w.hidden?'+':'−';
    });
  }
  d.appendChild(w);
  return d;
}
document.addEventListener('keydown',function(e){
  if(e.key!=='Escape')return;
  if(setSheet.classList.contains('on'))closeSet();
  else if(openId)closeSheet();
});

/* ロゴ。アイコンと同じ形（アメーバを脈が貫き、内側では地の色に反転する） */
(function(){
  var m=$('mark');if(!m)return;
  var seam='M4 92 L34 66 L66 34 L96 8';
  m.innerHTML='<defs><clipPath id="mkc"><path d="'+blobD(0)+'"/></clipPath></defs>'+
    '<path d="'+blobD(0)+'" fill="currentColor"/>'+
    '<path d="'+seam+'" fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round"/>'+
    '<path d="'+seam+'" fill="none" stroke="var(--void)" stroke-width="6" stroke-linecap="round" clip-path="url(#mkc)"/>';
})();

/* ───────── 立ち上げ ───────── */
place();
syncIdb();          /* IndexedDB の控えと足し合わせる */
askPersist();       /* 端末に「消さないで」と頼む */
draw();
$('tip').textContent=state.entries.length?'':'press';
goPane(0,false);
/* 途中で閉じたまま整形が終わっていない下書きを、開き直したときに拾い直す */
state.entries.forEach(function(e){if(!e.digest&&e.raw)shape(e)});
})();
</script>
